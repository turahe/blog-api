name: OpenAPI Contract Validation

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    paths:
      - "contracts/openapi.yaml"
      - "contracts/Dockerfile"
      - "contracts/.dockerignore"
      - "paths/**"
      - "components/**"
      - "scripts/contracts/**"
      - "package.json"
      - "package-lock.json"
      - "redocly.yaml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-openapi:
    name: Validate OpenAPI (Docker Redocly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint and bundle via Redocly Docker image
        run: make contracts

      - name: Setup Python (semantic / conformance checks)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary 'ruamel.yaml>=0.18' 'openapi-spec-validator>=0.7' pyyaml

      - name: Semantic validation (optional script)
        if: hashFiles('scripts/contracts/validate_openapi.py') != ''
        run: |
          python scripts/contracts/validate_openapi.py \
            --entry contracts/openapi.yaml \
            --bundle contracts/openapi.bundle.yaml \
            || true

      - name: Upload bundled specs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-bundles
          path: |
            contracts/openapi.bundle.yaml
            contracts/openapi.bundle.deref.yaml
            reports/**
          retention-days: 14
          if-no-files-found: warn

      - name: Conformance check (openapi-spec-validator)
        run: |
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          from openapi_spec_validator import validate_spec
          bundle = Path('contracts/openapi.bundle.yaml')
          if not bundle.exists():
              print('missing contracts/openapi.bundle.yaml')
              sys.exit(1)
          with bundle.open() as f:
              spec = yaml.safe_load(f)
          result = validate_spec(spec)
          errs = list(getattr(result, 'errors', None) or [])
          if errs:
              for e in errs:
                  print('CONFORMANCE:', e)
              sys.exit(1)
          print('openapi-spec-validator: OK')
          PY
