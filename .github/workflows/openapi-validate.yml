name: OpenAPI Contract Validation

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    paths:
      - "contracts/**"
      - "paths/**"
      - "components/**"
      - "internal/adapters/inbound/routes/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-openapi:
    name: Validate OpenAPI bundle + route parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Route registration smoke tests
        run: make routes-check

      - name: Setup Python (spec conformance)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Conformance check (openapi-spec-validator)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary 'openapi-spec-validator>=0.7'
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          from openapi_spec_validator import validate_spec
          bundle = Path('contracts/openapi.bundle.yaml')
          if not bundle.exists():
              print('missing contracts/openapi.bundle.yaml')
              sys.exit(1)
          with bundle.open() as f:
              spec = yaml.safe_load(f)
          result = validate_spec(spec)
          errs = list(getattr(result, 'errors', None) or [])
          if errs:
              for e in errs:
                  print('CONFORMANCE:', e)
              sys.exit(1)
          print('openapi-spec-validator: OK')
          PY
