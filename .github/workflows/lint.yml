name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Run go vet
        run: go vet . ./cmd/... ./internal/...

      - name: Check gofmt
        run: test -z "$(gofmt -l main.go cmd internal)"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0 # keep in sync with GOLANGCI_LINT_IMAGE in the Makefile
          args: --timeout 5m
          only-new-issues: true
