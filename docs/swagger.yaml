basePath: /
definitions:
  requests.ChangePassword:
    properties:
      confirm_password:
        type: string
      current_password:
        type: string
      new_password:
        maxLength: 128
        minLength: 12
        type: string
      revoke_all_sessions:
        type: boolean
    required:
    - confirm_password
    - current_password
    - new_password
    type: object
  requests.CreateCategory:
    properties:
      before_id:
        type: string
      description:
        maxLength: 2000
        type: string
      image_id:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      parent_id:
        type: string
      slug:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  requests.CreateComment:
    properties:
      author_email:
        maxLength: 254
        type: string
      author_name:
        description: Guest commenters only; ignored when a bearer token is sent.
        maxLength: 100
        type: string
      content:
        description: Plain text or markdown; HTML is not rendered.
        maxLength: 10000
        type: string
      honeypot:
        description: Leave empty. Anti-spam trap for bots; must stay hidden in forms.
        maxLength: 500
        type: string
      parent_id:
        format: uuid
        type: string
    required:
    - content
    type: object
  requests.CreatePost:
    properties:
      category_id:
        type: string
      content:
        type: string
      excerpt:
        maxLength: 2000
        type: string
      slug:
        maxLength: 255
        minLength: 1
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - content
    - title
    type: object
  requests.CreateTag:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      slug:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  requests.FlagComment:
    properties:
      details:
        maxLength: 2000
        type: string
      reason_code:
        enum:
        - spam
        - abuse
        - hate
        - harassment
        - doxx
        - self_harm
        - copyright
        - impersonation
        - illegal
        - other
        type: string
    required:
    - reason_code
    type: object
  requests.ForgotPassword:
    properties:
      email_or_username:
        type: string
    required:
    - email_or_username
    type: object
  requests.Login:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
      remember:
        type: boolean
    required:
    - email
    - password
    type: object
  requests.Logout:
    properties:
      refresh_token:
        type: string
    type: object
  requests.MergeTag:
    properties:
      into_id:
        type: string
    required:
    - into_id
    type: object
  requests.PatchMediaTags:
    properties:
      tags:
        items:
          type: string
        type: array
    required:
    - tags
    type: object
  requests.PostMediaItem:
    properties:
      kind:
        type: string
      media_asset_id:
        type: string
      sort_order:
        minimum: 0
        type: integer
    required:
    - kind
    - media_asset_id
    type: object
  requests.PresignMedia:
    properties:
      content_type:
        type: string
      original_filename:
        maxLength: 255
        minLength: 1
        type: string
      size_bytes:
        type: integer
      tags:
        items:
          type: string
        type: array
    required:
    - content_type
    - original_filename
    - size_bytes
    type: object
  requests.Refresh:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  requests.ReplacePostMedia:
    properties:
      enforce_cover_consistency:
        type: boolean
      items:
        items:
          $ref: '#/definitions/requests.PostMediaItem'
        type: array
    required:
    - items
    type: object
  requests.ResetPassword:
    properties:
      confirm_password:
        type: string
      new_password:
        maxLength: 128
        minLength: 12
        type: string
      token:
        type: string
    required:
    - confirm_password
    - new_password
    - token
    type: object
  requests.UpdateComment:
    properties:
      content:
        maxLength: 10000
        type: string
    required:
    - content
    type: object
  requests.UpdatePost:
    properties:
      category_id:
        description: Category UUID; null clears the category, omitting the field keeps
          it.
        format: uuid
        type: string
      content:
        type: string
      excerpt:
        type: string
      slug:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  requests.UpdateTag:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      slug:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  responses.Envelope:
    properties:
      code:
        type: integer
      data:
        type: object
      error:
        $ref: '#/definitions/responses.ErrorBody'
      links:
        $ref: '#/definitions/responses.PageLinks'
      meta:
        type: object
      ok:
        type: boolean
    type: object
  responses.ErrorBody:
    properties:
      code:
        type: string
      details:
        type: object
      message:
        type: string
    type: object
  responses.PageLinks:
    properties:
      first:
        type: string
      last:
        type: string
      next:
        type: string
      prev:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: https://github.com/turahe/blog-api
  description: Hexagonal blog platform REST API. Envelope responses use { ok, code,
    data, meta, error }.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Blog API
  version: "1.0"
