  /api/v1/analytics/consent:
    get:
      description: 'The current decisions of the subject identified by X-Consent-Token.
        An unknown or missing token is 404: treat it as no consent.'
      parameters:
      - description: consent subject token
        in: header
        name: X-Consent-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Envelope'
      summary: Get analytics consent
      tags:
      - analytics
    post:
      consumes:
      - application/json
      description: Records a decision per purpose (analytics, authenticated_analytics)
        with the policy version the visitor saw. Send the X-Consent-Token from an
        earlier response to update that subject; without it (or with an unknown token)
        a new subject is created and its token is returned once, with 201. Refusing
        a granted purpose withdraws it; withdrawing analytics deletes the analytics
        events already stored for the subject. authenticated_analytics needs a signed-in
        user and granted analytics, and links the subject to that user.
      parameters:
      - description: consent subject token
        in: header
        name: X-Consent-Token
        type: string
      - description: decisions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.StoreConsent'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/responses.Envelope'
      summary: Store analytics consent
      tags:
      - analytics
  /api/v1/analytics/consent/{param1}:
    delete:
      description: Withdraws one consent. Prove ownership with the subject's X-Consent-Token,
        or as the signed-in user the subject is linked to; otherwise 404. Withdrawing
        analytics also withdraws authenticated_analytics, unlinks the user, and deletes
        the analytics events already stored for the subject. Withdrawing a consent
        that is not granted changes nothing.
      parameters:
      - description: consent UUID
        in: path
        name: param1
        required: true
        type: string
      - description: consent subject token
        in: header
        name: X-Consent-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Envelope'
      summary: Withdraw analytics consent
      tags:
      - analytics
  /api/v1/analytics/ingest/navigation:
    post:
      consumes:
      - application/json
      description: A move from one page to another. from is omitted for an entry page;
        transition is internal, external, back_forward, or direct. Accepted asynchronously
        like page views.
      parameters:
      - description: consent subject token
        in: header
        name: X-Consent-Token
        type: string
      - description: navigation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.IngestNavigation'
