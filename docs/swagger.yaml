        gains search.rank, search.title, and search.snippet (HTML-escaped, matches in <mark>).
        q uses web search syntax: "quoted phrase", or, -excluded.
      parameters:
      - description: full-text search query (max 200 characters)
        in: query
        name: q
        type: string
      - default: 1
        description: page
        in: query
        name: page
        type: integer
      - default: 20
        description: per page
        in: query
        name: per_page
        type: integer
      - description: category UUID
        in: query
