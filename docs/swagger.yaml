  /api/v1/admin/impersonation/start:
    post:
      consumes:
      - application/json
      description: |-
        Opens an impersonation session and returns a Bearer token that acts as the target until
        expires_at (IMPERSONATION_TTL, never renewed; no refresh token). Requires impersonation.start,
        the caller's current password, and a TOTP or backup code when the caller has two-factor
        enabled. The target must be active, must not be an administrator or able to impersonate, and
        every permission the target has must be one the caller has. One active session per caller.
        The session ends with the caller's own sign-in (logout, revocation, or refresh-session expiry).
      parameters:
      - description: target, reason, and step-up proof
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.StartImpersonation'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: unauthorized, impersonation.sign_in_required (refresh the token
            first)
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: rbac.forbidden, impersonation.step_up_required, impersonation.forbidden_action
          schema:
            $ref: '#/definitions/responses.Envelope'
        "409":
          description: impersonation.already_active
          schema:
            $ref: '#/definitions/responses.Envelope'
        "422":
          description: impersonation.target_ineligible
          schema:
            $ref: '#/definitions/responses.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Start impersonating a user
      tags:
      - admin
  /api/v1/admin/impersonation/stop:
    post:
      description: |-
        Ends the session behind the impersonation token in the Authorization header, or the caller's
        active session when called with their own token. The impersonation token stops working
        immediately; the client switches back to the staff member's own token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "404":
