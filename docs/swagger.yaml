    post:
      consumes:
      - application/json
      description: |-
        For the delivery provider. The body is {"events":[{"type":"hard_bounce|soft_bounce|complaint",
        "email":"...","occurred_at":"RFC 3339"}]} (1-100 events), signed like outgoing custom_http
        requests: X-Newsletter-Timestamp (Unix seconds, within 5 minutes) and X-Newsletter-Signature
        v1=hex(HMAC-SHA256(NEWSLETTER_HTTP_SECRET, timestamp + "." + body)). Hard bounces and complaints
        suppress the address. 422 when NEWSLETTER_HTTP_SECRET is not set.
      parameters:
      - description: Unix seconds
        in: header
        name: X-Newsletter-Timestamp
        required: true
        type: string
      - description: v1=<hex HMAC-SHA256>
        in: header
        name: X-Newsletter-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: newsletter.signature_invalid
          schema:
            $ref: '#/definitions/responses.Envelope'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/responses.Envelope'
        "422":
          description: newsletter.not_configured
          schema:
            $ref: '#/definitions/responses.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/responses.Envelope'
      summary: Provider bounce and complaint webhook
      tags:
      - newsletter
