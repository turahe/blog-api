    get:
      description: 'Server-sent events. The stream opens with `retry: 5000` and `event:
        stream.opened`, sends `event: notification.created` for each new notice (id
        is the notification id), `event: ping` when idle, `event: error` with code
        fanout.buffer_full when events were dropped for a slow client, and `event:
        stream.closed` before a server shutdown (code shutdown) or once the impersonation
        session behind the token ends (code impersonation_ended). There is no replay:
        after reconnecting, call GET /api/v1/me/notifications to fill gaps. Returns
        429 notifications.stream_limit (with Retry-After) past the per-user limit
        and 503 notifications.stream_unavailable without a message broker.'
