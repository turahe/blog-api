basePath: /
definitions:
  requests.AdminCreateUser:
    properties:
      email:
        maxLength: 254
        type: string
      full_name:
        maxLength: 120
        type: string
      password:
        maxLength: 128
        minLength: 12
        type: string
      roles:
        items:
          type: string
        maxItems: 20
        type: array
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - roles
    - username
    type: object
  requests.AdminResetPassword:
    properties:
      revoke_sessions:
        description: RevokeSessions defaults to true.
        type: boolean
    type: object
  requests.AnalyticsExport:
    properties:
      current_password:
        maxLength: 128
        type: string
      from:
        example: "2026-08-01"
        type: string
      grain:
        enum:
        - day
        - week
        - month
        example: day
        type: string
      to:
        example: "2026-08-31"
        type: string
      two_factor_code:
        example: "123456"
        maxLength: 32
        type: string
    required:
    - current_password
    - from
    - to
    type: object
  requests.AssignUserRoles:
    properties:
      roles:
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
    required:
    - roles
    type: object
  requests.BulkModerateComments:
    properties:
      action:
        enum:
        - approve
        - reject
        - spam
        - restore
        type: string
      ids:
        items:
          type: string
        maxItems: 500
        minItems: 1
        type: array
      reason:
        maxLength: 1000
        type: string
    required:
    - action
    - ids
    type: object
  requests.ChangePassword:
    properties:
      confirm_password:
        type: string
      current_password:
        type: string
      new_password:
        maxLength: 128
        minLength: 12
        type: string
      revoke_all_sessions:
        type: boolean
    required:
    - confirm_password
    - current_password
    - new_password
    type: object
  requests.ConfirmEmailChange:
    properties:
      token:
        maxLength: 512
        type: string
    required:
    - token
    type: object
  requests.CreateCategory:
    properties:
      before_id:
        type: string
      description:
        maxLength: 2000
        type: string
      image_id:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      parent_id:
        type: string
      slug:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  requests.CreateComment:
    properties:
      author_email:
        maxLength: 254
        type: string
      author_name:
        description: Guest commenters only; ignored when a bearer token is sent.
        maxLength: 100
        type: string
      content:
        description: Plain text or markdown; HTML is not rendered.
        maxLength: 10000
        type: string
      honeypot:
        description: Leave empty. Anti-spam trap for bots; must stay hidden in forms.
        maxLength: 500
        type: string
      parent_id:
        format: uuid
        type: string
      turnstile_response:
        description: Cloudflare Turnstile token; required for guests when the server
          has TURNSTILE_SECRET_KEY set.
        maxLength: 2048
        type: string
    required:
    - content
    type: object
  requests.CreatePost:
    properties:
      category_id:
        type: string
      content:
        type: string
      excerpt:
        maxLength: 2000
        type: string
      slug:
        maxLength: 255
        minLength: 1
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - content
    - title
    type: object
  requests.CreateRole:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 60
        minLength: 2
        type: string
      permissions:
        items:
          type: string
        maxItems: 200
        type: array
    required:
    - name
    - permissions
    type: object
  requests.CreateTag:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      slug:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  requests.DisableTwoFactor:
    properties:
      code:
        maxLength: 32
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - code
    - password
    type: object
  requests.EraseAccount:
    properties:
      current_password:
        maxLength: 128
        type: string
    required:
    - current_password
    type: object
  requests.FlagComment:
    properties:
      details:
        maxLength: 2000
        type: string
      reason_code:
        enum:
        - spam
        - abuse
        - hate
        - harassment
        - doxx
        - self_harm
        - copyright
        - impersonation
        - illegal
        - other
        type: string
    required:
    - reason_code
    type: object
  requests.ForgotPassword:
    properties:
      email_or_username:
        type: string
    required:
    - email_or_username
    type: object
  requests.IngestNavigation:
    properties:
      from:
        maxLength: 2048
        type: string
      id:
        type: string
      session_id:
        type: string
      to:
        maxLength: 2048
        type: string
      transition:
        enum:
        - internal
        - external
        - back_forward
        - direct
        type: string
    required:
    - session_id
    - to
    - transition
    type: object
  requests.IngestPageView:
    properties:
      id:
        type: string
      path:
        maxLength: 2048
        type: string
      referrer:
        maxLength: 2048
        type: string
      session_id:
        type: string
    required:
    - path
    - session_id
    type: object
  requests.IngestSearch:
    properties:
      filters:
        additionalProperties:
          type: string
        type: object
      id:
        type: string
      query:
        maxLength: 1000
        type: string
      result_count:
        minimum: 0
        type: integer
      session_id:
        type: string
    required:
    - query
    - session_id
    type: object
  requests.IngestSearchClick:
    properties:
      id:
        type: string
      position:
        minimum: 1
        type: integer
      resource_id:
        type: string
      resource_type:
        enum:
        - post
        - page
        - category
        - tag
        type: string
      search_id:
        type: string
      session_id:
        type: string
    required:
    - position
    - resource_id
    - resource_type
    - search_id
    - session_id
    type: object
  requests.IngestTimeSpent:
    properties:
      focus_seconds:
        minimum: 0
        type: integer
      path:
        maxLength: 2048
        type: string
      session_id:
        type: string
      view_id:
        type: string
    required:
    - path
    - session_id
    - view_id
    type: object
  requests.Login:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
      remember:
        type: boolean
    required:
    - email
    - password
    type: object
  requests.Logout:
    properties:
      refresh_token:
        type: string
    type: object
  requests.MergeTag:
    properties:
      into_id:
        type: string
    required:
    - into_id
    type: object
  requests.ModerateComment:
    properties:
      action:
        enum:
        - approve
        - reject
        - spam
        - restore
        type: string
      notify_author:
        description: Recorded in the moderation log for author notifications.
        type: boolean
      reason:
        maxLength: 1000
        type: string
    required:
    - action
    type: object
  requests.NewsletterIssueCreate:
    properties:
      body_markdown:
        example: |-
          ## Hello

          This month...
        maxLength: 200000
        type: string
      lists:
        example:
        - weekly
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
      preheader:
        example: Three posts you may have missed
        maxLength: 200
        type: string
      send_at:
        example: "2026-10-01T09:00:00Z"
        type: string
      status:
        enum:
        - draft
        - scheduled
        - queued
        example: draft
        type: string
      subject:
        example: September highlights
        maxLength: 200
        type: string
    required:
    - body_markdown
    - lists
    - subject
    type: object
  requests.NewsletterIssuePatch:
    properties:
      body_markdown:
        maxLength: 200000
        type: string
      lists:
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
      preheader:
        maxLength: 200
        type: string
      send_at:
        type: string
      status:
        enum:
        - draft
        - scheduled
        - queued
        - cancelled
        example: cancelled
        type: string
      subject:
        maxLength: 200
        type: string
    required:
    - lists
    type: object
  requests.NewsletterList:
    properties:
      description:
        example: The week's posts, every Friday
        maxLength: 500
        type: string
      is_default:
        example: true
        type: boolean
      name:
        example: Weekly digest
        maxLength: 100
        type: string
      slug:
        example: weekly
        maxLength: 64
        type: string
    required:
    - name
    - slug
    type: object
  requests.NewsletterMeSubscribe:
    properties:
      format:
        enum:
        - html
        - plaintext
        example: html
        type: string
      lists:
        example:
        - weekly
        items:
          type: string
        maxItems: 20
        type: array
    required:
    - lists
    type: object
  requests.NewsletterMeUnsubscribe:
    properties:
      feedback:
        maxLength: 1000
        type: string
      lists:
        items:
          type: string
        maxItems: 20
        type: array
      reason_code:
        enum:
        - too_frequent
        - not_relevant
        - never_signed_up
        - other
        type: string
    required:
    - lists
    type: object
  requests.NewsletterPreferences:
    properties:
      format:
        enum:
        - html
        - plaintext
        example: plaintext
        type: string
      lists:
        items:
          type: string
        maxItems: 20
        type: array
      unsubscribe_all:
        type: boolean
    required:
    - lists
    type: object
  requests.NewsletterProviderConfig:
    properties:
      confirm_ttl_hours:
        example: 48
        maximum: 168
        minimum: 1
        type: integer
      double_optin_required:
        example: true
        type: boolean
      from_email:
        example: newsletter@example.com
        maxLength: 254
        type: string
      from_name:
        example: Turahe Blog
        maxLength: 100
        type: string
      lists:
        items:
          $ref: '#/definitions/requests.NewsletterList'
        maxItems: 20
        minItems: 1
        type: array
      postal_address:
        example: 123 Example Street, Jakarta, ID
        maxLength: 500
        type: string
      reply_to:
        example: hello@example.com
        maxLength: 254
        type: string
    required:
    - confirm_ttl_hours
    - double_optin_required
    - lists
    type: object
  requests.NewsletterResend:
    properties:
      email:
        example: reader@example.com
        maxLength: 254
        type: string
    required:
    - email
    type: object
  requests.NewsletterSubscribe:
    properties:
      display_name:
        example: Alex
        maxLength: 100
        type: string
      email:
        example: reader@example.com
        maxLength: 254
        type: string
      format:
        enum:
        - html
        - plaintext
        example: html
        type: string
      honeypot:
        maxLength: 200
        type: string
      lists:
        example:
        - weekly
        items:
          type: string
        maxItems: 20
        type: array
      turnstile_response:
        maxLength: 2048
        type: string
    required:
    - email
    - lists
    type: object
  requests.NewsletterToken:
    properties:
      token:
        maxLength: 128
        type: string
    required:
    - token
    type: object
  requests.NewsletterUnsubscribe:
    properties:
      feedback:
        maxLength: 1000
        type: string
      reason_code:
        enum:
        - too_frequent
        - not_relevant
        - never_signed_up
        - other
        type: string
      token:
        maxLength: 128
        type: string
    type: object
  requests.OAuthCallback:
    properties:
      code:
        maxLength: 2048
        type: string
      state:
        maxLength: 128
        type: string
    required:
    - code
    - state
    type: object
  requests.PatchMediaTags:
    properties:
      tags:
        items:
          type: string
        type: array
    required:
    - tags
    type: object
  requests.PatchProfile:
    properties:
      bio:
        type: string
      contact_location:
        type: string
      contact_website:
        type: string
      display_name:
        type: string
      full_name:
        type: string
      locale:
        example: en_US
        type: string
      marketing_consent:
        type: boolean
      social_links:
        $ref: '#/definitions/requests.SocialLinks'
      timezone:
        example: Asia/Jakarta
        type: string
    type: object
  requests.PostMediaItem:
    properties:
      kind:
        type: string
      media_asset_id:
        type: string
      sort_order:
        minimum: 0
        type: integer
    required:
    - kind
    - media_asset_id
    type: object
  requests.PresignMedia:
    properties:
      content_type:
        type: string
      original_filename:
        maxLength: 255
        minLength: 1
        type: string
      size_bytes:
        type: integer
      tags:
        items:
          type: string
        type: array
    required:
    - content_type
    - original_filename
    - size_bytes
    type: object
  requests.PreviewPostSEO:
    properties:
      canonical_url:
        type: string
      excerpt:
        maxLength: 2000
        type: string
      og_description:
        type: string
      og_image_id:
        format: uuid
        type: string
      og_title:
        type: string
      og_url:
        type: string
      robots_nofollow:
        type: boolean
      robots_noindex:
        type: boolean
      seo_description:
        type: string
      seo_keywords:
        items:
          type: string
        type: array
      seo_title:
        type: string
      slug:
        type: string
      title:
        maxLength: 255
        type: string
      twitter_card:
        type: string
      twitter_creator:
        type: string
      twitter_description:
        type: string
      twitter_image_id:
        format: uuid
        type: string
      twitter_title:
        type: string
    type: object
  requests.Refresh:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  requests.ReplacePostMedia:
    properties:
      enforce_cover_consistency:
        type: boolean
      items:
        items:
          $ref: '#/definitions/requests.PostMediaItem'
        type: array
    required:
    - items
    type: object
  requests.RequestEmailChange:
    properties:
      new_email:
        maxLength: 254
        type: string
      password_proof:
        maxLength: 128
        type: string
    required:
    - new_email
    - password_proof
    type: object
  requests.ResetPassword:
    properties:
      confirm_password:
        type: string
      new_password:
        maxLength: 128
        minLength: 12
        type: string
      token:
        type: string
    required:
    - confirm_password
    - new_password
    - token
    type: object
  requests.RestoreRevision:
    properties:
      restore_note:
        maxLength: 1000
        type: string
    type: object
  requests.SetRolePermissions:
    properties:
      permissions:
        items:
          type: string
        maxItems: 200
        type: array
    required:
    - permissions
    type: object
  requests.SettingUpdate:
    properties:
      key:
        maxLength: 128
        type: string
      value:
        type: object
      version:
        minimum: 0
        type: integer
    required:
    - key
    type: object
  requests.SocialLinks:
    properties:
      github:
        type: string
      linkedin:
        type: string
      twitter:
        type: string
    type: object
  requests.StartImpersonation:
    properties:
      current_password:
        maxLength: 128
        type: string
      reason:
        example: 'Ticket #4521: author cannot publish'
        maxLength: 255
        minLength: 10
        type: string
      target_user_id:
        example: 0b8f5c1e-3c1a-4f5e-9d7a-2a1b3c4d5e6f
        type: string
      two_factor_code:
        example: "123456"
        maxLength: 32
        type: string
    required:
    - current_password
    - reason
    - target_user_id
    type: object
  requests.StoreConsent:
    properties:
      policy_version:
        maxLength: 32
        type: string
      purposes:
        additionalProperties:
          type: boolean
        type: object
    required:
    - policy_version
    - purposes
    type: object
  requests.TwoFactorChallenge:
    properties:
      challenge_token:
        maxLength: 128
        type: string
      code:
        maxLength: 32
        type: string
    required:
    - challenge_token
    - code
    type: object
  requests.TwoFactorCode:
    properties:
      code:
        maxLength: 32
        type: string
    required:
    - code
    type: object
  requests.UpdateComment:
    properties:
      content:
        maxLength: 10000
        type: string
    required:
    - content
    type: object
  requests.UpdatePost:
    properties:
      category_id:
        description: Category UUID; null clears the category, omitting the field keeps
          it.
        format: uuid
        type: string
      comment_policy:
        description: 'Who may comment: open, authenticated, read_only, or disabled
          (hides existing comments).'
        enum:
        - open
        - authenticated
        - read_only
        - disabled
        type: string
      content:
        type: string
      excerpt:
        type: string
      slug:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  requests.UpdatePostSEO:
    properties:
      canonical_url:
        type: string
      og_description:
        type: string
      og_image_id:
        format: uuid
        type: string
      og_title:
        type: string
      og_url:
        type: string
      robots_nofollow:
        type: boolean
      robots_noindex:
        type: boolean
      seo_description:
        type: string
      seo_keywords:
        items:
          type: string
        type: array
      seo_title:
        type: string
      slug:
        type: string
      twitter_card:
        type: string
      twitter_creator:
        type: string
      twitter_description:
        type: string
      twitter_image_id:
        format: uuid
        type: string
      twitter_title:
        type: string
    type: object
  requests.UpdatePrivacy:
    properties:
      current_password:
        maxLength: 128
        type: string
      search_allow_indexing:
        type: boolean
      visibility_contact:
        type: boolean
      visibility_email:
        type: boolean
      visibility_profile:
        enum:
        - public
        - unlisted
        - private
        example: private
        type: string
    type: object
  requests.UpdateRole:
    properties:
      description:
        maxLength: 255
        type: string
    type: object
  requests.UpdateSettings:
    properties:
      updates:
        items:
          $ref: '#/definitions/requests.SettingUpdate'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - updates
    type: object
  requests.UpdateTag:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      slug:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  responses.Envelope:
    properties:
      code:
        type: integer
      data:
        type: object
      error:
        $ref: '#/definitions/responses.ErrorBody'
      links:
        $ref: '#/definitions/responses.PageLinks'
      meta:
        type: object
      ok:
        type: boolean
    type: object
  responses.ErrorBody:
    properties:
      code:
        type: string
      details:
        type: object
      message:
        type: string
    type: object
  responses.PageLinks:
    properties:
      first:
        type: string
      last:
        type: string
      next:
        type: string
      prev:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: https://github.com/turahe/blog-api
  description: Hexagonal blog platform REST API. Envelope responses use { ok, code,
    data, meta, error }.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Blog API
  version: "1.0"
paths:
  /api/v1/admin/analytics/export:
    post:
      consumes:
      - application/json
      description: 'Queues a ZIP of CSV files with every rollup (site, pages, referrers,
        audience, navigation, searches, search positions, clicked results) of whole
        periods covering from through to, plus the daily retention cohorts. No raw
        events, visitor hashes, or session ids are exported. Requires the current
        password, and two_factor_code when two-factor is enabled. The archive is built
        in the background: poll GET /api/v1/admin/analytics/exports/{param1} for a
        presigned download link. One export per user may be open; a second request
        answers 409 with the open one in error.details.'
      parameters:
      - description: window and step-up credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.AnalyticsExport'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/responses.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Request an analytics export
      tags:
      - admin
  /api/v1/admin/analytics/exports:
    get:
      description: The caller's 20 most recent exports, newest first. Completed exports
        whose archive still exists carry a fresh presigned download_url valid for
        ANALYTICS_EXPORT_URL_TTL (never past archive_expires_at).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: List my analytics exports
      tags:
      - admin
  /api/v1/admin/analytics/exports/{param1}:
    get:
      description: Status of one of the caller's exports; other users' exports answer
        404. A completed export whose archive still exists carries a fresh presigned
        download_url; after ANALYTICS_EXPORT_RETENTION the archive is deleted and
        status is expired.
      parameters:
      - description: export id
        in: path
        name: param1
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: Forbidden
          schema:
