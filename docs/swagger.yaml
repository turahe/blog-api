        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: analytics.consent_required
          schema:
            $ref: '#/definitions/responses.Envelope'
        "404":
          description: analytics.disabled
          schema:
            $ref: '#/definitions/responses.Envelope'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/responses.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/responses.Envelope'
      summary: Record a navigation
      tags:
      - analytics
  /api/v1/analytics/ingest/page-view:
    post:
      consumes:
      - application/json
      description: 'Records a page load. The path''s query and fragment are dropped.
        id (optional, a UUID) is the page view id that time-spent heartbeats refer
        to; it is generated when omitted and returned either way. Events are written
        asynchronously: 202 does not mean the event was stored (bots, prefetches,
        and visitors who refused consent are dropped silently). With analytics.consent_required
        on, a granted X-Consent-Token is required (403 analytics.consent_required);
        without granted consent, events are stored without a link to any subject.'
      parameters:
      - description: consent subject token
        in: header
