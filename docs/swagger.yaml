basePath: /
definitions:
  requests.AdminCreateUser:
    properties:
      email:
        maxLength: 254
        type: string
      full_name:
        maxLength: 120
        type: string
      password:
        maxLength: 128
        minLength: 12
        type: string
      roles:
        items:
          type: string
        maxItems: 20
        type: array
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - roles
    - username
    type: object
  requests.AdminResetPassword:
    properties:
      revoke_sessions:
        description: RevokeSessions defaults to true.
        type: boolean
    type: object
  requests.AssignUserRoles:
    properties:
      roles:
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
    required:
    - roles
    type: object
  requests.BulkModerateComments:
    properties:
      action:
        enum:
        - approve
        - reject
        - spam
        - restore
        type: string
      ids:
        items:
          type: string
        maxItems: 500
        minItems: 1
        type: array
      reason:
        maxLength: 1000
        type: string
    required:
    - action
    - ids
    type: object
  requests.ChangePassword:
    properties:
      confirm_password:
        type: string
      current_password:
        type: string
      new_password:
        maxLength: 128
        minLength: 12
        type: string
      revoke_all_sessions:
        type: boolean
    required:
    - confirm_password
    - current_password
    - new_password
    type: object
  requests.ConfirmEmailChange:
    properties:
      token:
        maxLength: 512
        type: string
    required:
    - token
    type: object
  requests.CreateCategory:
    properties:
      before_id:
        type: string
      description:
        maxLength: 2000
        type: string
      image_id:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      parent_id:
        type: string
      slug:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  requests.CreateComment:
    properties:
      author_email:
        maxLength: 254
        type: string
      author_name:
        description: Guest commenters only; ignored when a bearer token is sent.
        maxLength: 100
        type: string
      content:
        description: Plain text or markdown; HTML is not rendered.
        maxLength: 10000
        type: string
      honeypot:
        description: Leave empty. Anti-spam trap for bots; must stay hidden in forms.
        maxLength: 500
        type: string
      parent_id:
        format: uuid
        type: string
      turnstile_response:
        description: Cloudflare Turnstile token; required for guests when the server
          has TURNSTILE_SECRET_KEY set.
        maxLength: 2048
        type: string
    required:
    - content
    type: object
  requests.CreatePost:
    properties:
      category_id:
        type: string
      content:
        type: string
      excerpt:
        maxLength: 2000
        type: string
      slug:
        maxLength: 255
        minLength: 1
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - content
    - title
    type: object
  requests.CreateRole:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 60
        minLength: 2
        type: string
      permissions:
        items:
          type: string
        maxItems: 200
        type: array
    required:
    - name
    - permissions
    type: object
  requests.CreateTag:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      slug:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  requests.DisableTwoFactor:
    properties:
      code:
        maxLength: 32
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - code
    - password
    type: object
  requests.FlagComment:
    properties:
      details:
        maxLength: 2000
        type: string
      reason_code:
        enum:
        - spam
        - abuse
        - hate
        - harassment
        - doxx
        - self_harm
        - copyright
        - impersonation
        - illegal
        - other
        type: string
    required:
    - reason_code
    type: object
  requests.ForgotPassword:
    properties:
      email_or_username:
        type: string
    required:
    - email_or_username
    type: object
  requests.Login:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
      remember:
        type: boolean
    required:
    - email
    - password
    type: object
  requests.Logout:
    properties:
      refresh_token:
        type: string
    type: object
  requests.MergeTag:
    properties:
      into_id:
        type: string
    required:
    - into_id
    type: object
  requests.ModerateComment:
    properties:
      action:
        enum:
        - approve
        - reject
        - spam
        - restore
        type: string
      notify_author:
        description: Recorded in the moderation log for author notifications.
        type: boolean
      reason:
        maxLength: 1000
        type: string
    required:
    - action
    type: object
  requests.OAuthCallback:
    properties:
      code:
        maxLength: 2048
        type: string
      state:
        maxLength: 128
        type: string
    required:
    - code
    - state
    type: object
  requests.PatchMediaTags:
    properties:
      tags:
        items:
          type: string
        type: array
    required:
    - tags
    type: object
  requests.PatchProfile:
    properties:
      bio:
        type: string
      contact_location:
        type: string
      contact_website:
        type: string
      display_name:
        type: string
      full_name:
        type: string
      locale:
        example: en_US
        type: string
      marketing_consent:
        type: boolean
      social_links:
        $ref: '#/definitions/requests.SocialLinks'
      timezone:
        example: Asia/Jakarta
        type: string
    type: object
  requests.PostMediaItem:
    properties:
      kind:
        type: string
      media_asset_id:
        type: string
      sort_order:
        minimum: 0
        type: integer
    required:
    - kind
    - media_asset_id
    type: object
  requests.PresignMedia:
    properties:
      content_type:
        type: string
      original_filename:
        maxLength: 255
        minLength: 1
        type: string
      size_bytes:
        type: integer
      tags:
        items:
          type: string
        type: array
    required:
    - content_type
    - original_filename
    - size_bytes
    type: object
  requests.Refresh:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  requests.ReplacePostMedia:
    properties:
      enforce_cover_consistency:
        type: boolean
      items:
        items:
          $ref: '#/definitions/requests.PostMediaItem'
        type: array
    required:
    - items
    type: object
  requests.RequestEmailChange:
    properties:
      new_email:
        maxLength: 254
        type: string
      password_proof:
        maxLength: 128
        type: string
    required:
    - new_email
    - password_proof
    type: object
  requests.ResetPassword:
    properties:
      confirm_password:
        type: string
      new_password:
        maxLength: 128
        minLength: 12
        type: string
      token:
        type: string
    required:
    - confirm_password
    - new_password
    - token
    type: object
  requests.SetRolePermissions:
    properties:
      permissions:
        items:
          type: string
        maxItems: 200
        type: array
    required:
    - permissions
    type: object
  requests.SettingUpdate:
    properties:
      key:
        maxLength: 128
        type: string
      value:
        type: object
      version:
        minimum: 0
        type: integer
    required:
    - key
    type: object
  requests.SocialLinks:
    properties:
      github:
        type: string
      linkedin:
        type: string
      twitter:
        type: string
    type: object
  requests.TwoFactorChallenge:
    properties:
      challenge_token:
        maxLength: 128
        type: string
      code:
        maxLength: 32
        type: string
    required:
    - challenge_token
    - code
    type: object
  requests.TwoFactorCode:
    properties:
      code:
        maxLength: 32
        type: string
    required:
    - code
    type: object
  requests.UpdateComment:
    properties:
      content:
        maxLength: 10000
        type: string
    required:
    - content
    type: object
  requests.UpdatePost:
    properties:
      category_id:
        description: Category UUID; null clears the category, omitting the field keeps
          it.
        format: uuid
        type: string
      comment_policy:
        description: 'Who may comment: open, authenticated, read_only, or disabled
          (hides existing comments).'
        enum:
        - open
        - authenticated
        - read_only
        - disabled
        type: string
      content:
        type: string
      excerpt:
        type: string
      slug:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  requests.UpdateRole:
    properties:
      description:
        maxLength: 255
        type: string
    type: object
  requests.UpdateSettings:
    properties:
      updates:
        items:
          $ref: '#/definitions/requests.SettingUpdate'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - updates
    type: object
  requests.UpdateTag:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      slug:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  responses.Envelope:
    properties:
      code:
        type: integer
      data:
        type: object
      error:
        $ref: '#/definitions/responses.ErrorBody'
      links:
        $ref: '#/definitions/responses.PageLinks'
      meta:
        type: object
      ok:
        type: boolean
    type: object
  responses.ErrorBody:
    properties:
      code:
        type: string
      details:
        type: object
      message:
        type: string
    type: object
  responses.PageLinks:
    properties:
      first:
        type: string
      last:
        type: string
      next:
        type: string
      prev:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: https://github.com/turahe/blog-api
  description: Hexagonal blog platform REST API. Envelope responses use { ok, code,
    data, meta, error }.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Blog API
  version: "1.0"
paths:
  /api/v1/admin/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Same request, responses, lockout and two-factor challenge as POST /api/v1/auth/login,
        but only accounts holding the `admin.access` permission may sign in. Any other
        account gets the same 401 as a wrong password.
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.Login'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "429":
          description: rate limited or account locked; see Retry-After
          schema:
            $ref: '#/definitions/responses.Envelope'
        "503":
          description: two-factor account but 2FA is not configured
          schema:
            $ref: '#/definitions/responses.Envelope'
      summary: Admin login
      tags:
      - admin
  /api/v1/admin/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: List categories (admin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: category
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.CreateCategory'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Create category
      tags:
      - admin
  /api/v1/admin/categories/{param1}:
    delete:
      parameters:
      - description: category UUID
        in: path
        name: param1
        required: true
        type: string
      responses:
        "204":
          description: No content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Delete category
      tags:
      - admin
    patch:
      consumes:
      - application/json
      parameters:
      - description: category UUID
        in: path
        name: param1
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Update category
      tags:
      - admin
  /api/v1/admin/categories/{param1}/move:
    post:
      consumes:
      - application/json
      parameters:
      - description: category UUID
        in: path
        name: param1
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Move category in tree
      tags:
      - admin
  /api/v1/admin/comments:
    get:
      description: Comments in any status across posts. Defaults to the moderation
        queue (pending and flagged), oldest first.
      parameters:
      - description: 'comma-separated statuses: pending, approved, flagged, spam,
          rejected, deleted'
        in: query
        name: status
        type: string
      - description: post UUID
        in: query
        name: post_id
        type: string
      - default: oldest
        description: oldest or newest
        enum:
        - oldest
        - newest
        in: query
        name: sort
        type: string
      - default: 1
        description: page
        in: query
        name: page
        type: integer
      - default: 20
        description: per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: List comments for moderation
      tags:
      - admin
  /api/v1/admin/comments/{param1}:
    delete:
      description: Removes the comment row. A comment with replies is scrubbed instead
        (content and author erased, kept as a deleted placeholder) so its replies
        survive; outcome reports which happened. The action is recorded in the moderation
        log.
      parameters:
      - description: comment UUID
        in: path
        name: param1
        required: true
        type: string
      - description: moderation reason, up to 1000 characters
        in: query
        name: reason
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Permanently delete a comment
      tags:
      - admin
    get:
      description: Any status, with author identity, flags, and the moderation log
        with before/after snapshots.
      parameters:
      - description: comment UUID
        in: path
        name: param1
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Get a comment for review
      tags:
      - admin
  /api/v1/admin/comments/{param1}/moderate:
    post:
      consumes:
      - application/json
      description: approve, reject, or spam a comment, or restore a deleted one. Returns
        409 when the action is not allowed from the current status.
      parameters:
      - description: comment UUID
        in: path
        name: param1
        required: true
        type: string
      - description: moderation action
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.ModerateComment'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Moderate a comment
      tags:
      - admin
  /api/v1/admin/comments/bulk-moderate:
    post:
      consumes:
      - application/json
      description: 'Applies one action to up to 500 comments in a single transaction:
        all change or none do. Unknown ids return 404 and disallowed transitions 409,
        both listing the offending ids in error.details.ids.'
      parameters:
      - description: comment ids and action
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.BulkModerateComments'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Bulk moderate comments
      tags:
      - admin
  /api/v1/admin/comments/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Comment moderation stats
      tags:
      - admin
  /api/v1/admin/media:
    get:
      parameters:
      - default: 1
        description: page
        in: query
        name: page
        type: integer
      - default: 20
        description: per page
        in: query
        name: per_page
        type: integer
      - description: search
        in: query
        name: q
        type: string
      - description: disk filter
        in: query
        name: disk
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: List media assets
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: upload metadata
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.PresignMedia'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Presign media upload
      tags:
      - admin
  /api/v1/admin/media/{param1}:
    delete:
      parameters:
      - description: media UUID
        in: path
        name: param1
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Delete media asset
      tags:
      - admin
  /api/v1/admin/media/{param1}/complete:
    post:
      parameters:
      - description: media UUID
        in: path
        name: param1
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Complete media upload
      tags:
      - admin
  /api/v1/admin/media/{param1}/tags:
    patch:
      consumes:
      - application/json
      parameters:
      - description: media UUID
        in: path
        name: param1
        required: true
        type: string
      - description: tags
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.PatchMediaTags'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: Patch media tags
      tags:
      - admin
  /api/v1/admin/permissions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.Envelope'
      security:
      - Bearer: []
      summary: List registered permissions
      tags:
      - admin
  /api/v1/admin/posts:
    get:
      parameters:
      - default: 1
