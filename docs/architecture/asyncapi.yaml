  schemas:
    PostEventPayload:
      type: object
      required:
      - post_id
      - author_id
      properties:
        post_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - draft
          - scheduled
          - published
          - archived
        slug:
          type: string
        version:
          type: integer
        published_at:
          type: string
          format: date-time
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        cover_image_media_id:
          type: string
          format: uuid
          nullable: true
    CommentEventPayload:
      type: object
      required:
      - comment_id
      - post_id
      - status
      properties:
        comment_id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        author_id:
          type: string
          format: uuid
          nullable: true
          description: Null for guest comments.
        status:
          type: string
          description: Status after the change.
        action:
          type: string
          enum:
          - approve
          - reject
          - spam
          - restore
          - hard_delete
          description: Moderation events only.
        from_status:
          type: string
          description: Moderation events only.
    UserEventPayload:
      type: object
      required:
      - user_id
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        status:
          type: string
        avatar_id:
          type: string
          format: uuid
          nullable: true
    NotificationEmailRequestedPayload:
      type: object
      required:
      - ciphertext
      properties:
        ciphertext:
          type: string
          description: Base64 AES-GCM ciphertext of {"to", "subject", "text"} under the APP_ENCRYPTION_KEY-derived key. Emails can carry raw reset tokens, so they are never stored in plaintext.
    MediaEventPayload:
      type: object
      required:
      - media_asset_id
      - storage_key
      - disk
      properties:
        media_asset_id:
          type: string
          format: uuid
        storage_key:
          type: string
        disk:
          type: string
          enum:
          - s3
          - r2
          - minio
          - do_spaces
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        referenced_by:
          type: array
          items:
            type: string
            enum:
            - users.avatar_id
            - posts.cover_image_media_id
            - categories.image_id
            - post_media
    UserProfileUpdatedPayload:
      type: object
      required:
      - event_id
      - event_name
      - occurred_at
      - aggregate_id
      - actor_id
      - diff_before_hash
      - diff_after_keys
      properties:
        event_id:
          type: string
          format: uuid
        event_name:
          const: user.profile.updated
        occurred_at:
          type: string
          format: date-time
        aggregate_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: System or anonymous actor when null.
        impersonator_id:
          type: string
          format: uuid
          nullable: true
        impersonation_session_id:
          type: string
          format: uuid
          nullable: true
        request_id:
          type: string
          nullable: true
        diff_before_hash:
          type: object
          description: Hashed only for sensitive fields; public-safe fields show plain before value.
          additionalProperties: true
        diff_after_keys:
          type: object
          additionalProperties: true
        admin_initiated:
          type: boolean
          default: false
    UserAvatarUpdatedPayload:
      type: object
      required:
      - event_id
      - event_name
      - occurred_at
      - aggregate_id
      - actor_id
      properties:
        event_id:
          type: string
          format: uuid
        event_name:
          const: user.profile.avatar_updated
        occurred_at:
          type: string
          format: date-time
        aggregate_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: System or anonymous actor when null.
        impersonator_id:
          type: string
          format: uuid
          nullable: true
        impersonation_session_id:
          type: string
          format: uuid
          nullable: true
        request_id:
          type: string
          nullable: true
        old_media_asset_id:
          type: string
          format: uuid
          nullable: true
        new_media_asset_id:
          type: string
          format: uuid
          nullable: true
        size_variants:
