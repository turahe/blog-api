asyncapi: 2.6.0
info:
  title: Blog Platform AsyncAPI
  description: "Event-driven and streaming interfaces for the blog platform (Watermill outbox, pub/sub, and SSE streams).\n\nThis AsyncAPI contract documents the asynchronous communication for the blog backend:\n  - Transactional outbox events published via Watermill\n  - Internal pub/sub topic conventions for consumers\n  - Server-Sent Events streams realtime notifications and admin live views\nThis contract aligns with `docs/backend/events.md`, `docs/backend/notification.md`, `docs/backend/impersonation.md`, and the analytics dashboards in `docs/features/analytics-dashboard.md` and `docs/backend/analytics.md`.\n"
  contact:
    name: Platform Team
  version: 1.0.0
defaultContentType: application/json
servers:
  local:
    url: localhost
    description: Local development (Redis streams or in-memory pub/sub for Watermill; SSE via HTTP)
    protocol: redis
    variables:
      port:
        default: '6379'
    bindings:
      redis:
        password: ${REDIS_PASSWORD}
  sse-local:
    url: http://localhost:8080
    description: SSE stream base for local HTTP server
    protocol: http
    security:
    - httpBearerAuth: []
  prod-bus:
    url: ${EVENT_BUS_URL}
    description: Production event bus (Watermill router + any supported broker, e.g. Kafka or Redis streams)
    protocol: redis
    security:
    - userPassword: []
channels:
  blog.post.created:
    description: Raised after a post is persisted.
    subscribe:
      summary: Consumers can subscribe (e.g., cache invalidation, search indexers)
      operationId: onPostCreated
      tags:
      - name: post
      - name: outbox
      message:
        $ref: '#/components/messages/PostCreated'
    publish:
      summary: Post service publishes (via transactional outbox)
      operationId: publishPostCreated
      message:
        $ref: '#/components/messages/PostCreated'
  blog.post.updated:
    subscribe:
      operationId: onPostUpdated
      message:
        $ref: '#/components/messages/PostUpdated'
    publish:
      operationId: publishPostUpdated
      message:
        $ref: '#/components/messages/PostUpdated'
  blog.post.published:
    subscribe:
      operationId: onPostPublished
      message:
        $ref: '#/components/messages/PostPublished'
    publish:
      operationId: publishPostPublished
      message:
        $ref: '#/components/messages/PostPublished'
  blog.post.archived:
    subscribe:
      operationId: onPostArchived
      message:
        $ref: '#/components/messages/PostArchived'
    publish:
      operationId: publishPostArchived
      message:
        $ref: '#/components/messages/PostArchived'
  blog.comment.created:
    subscribe:
      operationId: onCommentCreated
      message:
        $ref: '#/components/messages/CommentCreated'
    publish:
      operationId: publishCommentCreated
      message:
        $ref: '#/components/messages/CommentCreated'
  blog.comment.moderated:
    description: A moderator approved, rejected, marked as spam, restored, or hard-deleted a comment.
    subscribe:
      operationId: onCommentModerated
      message:
        $ref: '#/components/messages/CommentModerated'
    publish:
      operationId: publishCommentModerated
      message:
        $ref: '#/components/messages/CommentModerated'
  blog.auth.logged_in:
    subscribe:
      operationId: onAuthLoggedIn
      message:
        $ref: '#/components/messages/AuthLoggedIn'
    publish:
      operationId: publishAuthLoggedIn
      message:
        $ref: '#/components/messages/AuthLoggedIn'
  blog.user.created:
    subscribe:
      operationId: onUserCreated
      message:
        $ref: '#/components/messages/UserCreated'
    publish:
      operationId: publishUserCreated
      message:
        $ref: '#/components/messages/UserCreated'
  blog.user.role_assigned:
    subscribe:
      operationId: onUserRoleAssigned
      message:
        $ref: '#/components/messages/UserRoleAssigned'
    publish:
      operationId: publishUserRoleAssigned
      message:
        $ref: '#/components/messages/UserRoleAssigned'
  blog.user.avatar_updated:
    description: Raised when a user avatar_id changes, used to invalidate user caches and fan-out UI updates.
    subscribe:
      operationId: onUserAvatarUpdated
      message:
        $ref: '#/components/messages/UserAvatarUpdated'
    publish:
      operationId: publishUserAvatarUpdated
      message:
        $ref: '#/components/messages/UserAvatarUpdated'
  blog.role.updated:
    subscribe:
      operationId: onRoleUpdated
      message:
        $ref: '#/components/messages/RoleUpdated'
    publish:
      operationId: publishRoleUpdated
      message:
        $ref: '#/components/messages/RoleUpdated'
  blog.media.uploaded:
    subscribe:
      operationId: onMediaUploaded
      message:
        $ref: '#/components/messages/MediaUploaded'
    publish:
      operationId: publishMediaUploaded
      message:
        $ref: '#/components/messages/MediaUploaded'
  blog.media.deleted:
    subscribe:
      operationId: onMediaDeleted
      message:
        $ref: '#/components/messages/MediaDeleted'
    publish:
      operationId: publishMediaDeleted
      message:
        $ref: '#/components/messages/MediaDeleted'
  notification.email.requested:
    description: Command to send one rendered email. The API records it in the outbox when a broker and APP_ENCRYPTION_KEY are configured; the worker's email-dispatch consumer decrypts and sends it.
    subscribe:
      operationId: onNotificationEmailRequested
      message:
        $ref: '#/components/messages/NotificationEmailRequested'
    publish:
      operationId: publishNotificationEmailRequested
      message:
        $ref: '#/components/messages/NotificationEmailRequested'
  blog.dead_letter:
    description: Messages a worker consumer could not handle after its retries. The original payload and headers are kept, plus the Watermill poison-queue headers.
    subscribe:
      operationId: onDeadLetter
      message:
        $ref: '#/components/messages/DeadLetter'
    publish:
      operationId: publishDeadLetter
      message:
        $ref: '#/components/messages/DeadLetter'
  blog.media.variant.generated:
    subscribe:
      operationId: onMediaVariantGenerated
      message:
        $ref: '#/components/messages/MediaVariantGenerated'
    publish:
      operationId: publishMediaVariantGenerated
      message:
        $ref: '#/components/messages/MediaVariantGenerated'
  blog.post.media_updated:
    description: Raised when post_media associations change; consumers invalidate entity caches.
    subscribe:
      operationId: onPostMediaUpdated
      message:
        $ref: '#/components/messages/PostMediaUpdated'
    publish:
      operationId: publishPostMediaUpdated
      message:
        $ref: '#/components/messages/PostMediaUpdated'
  blog.category.image_updated:
    description: Raised when a category cover image_id changes.
    subscribe:
      operationId: onCategoryImageUpdated
      message:
        $ref: '#/components/messages/CategoryImageUpdated'
    publish:
      operationId: publishCategoryImageUpdated
      message:
        $ref: '#/components/messages/CategoryImageUpdated'
  blog.settings.updated:
    subscribe:
      operationId: onSettingsUpdated
      message:
        $ref: '#/components/messages/SettingsUpdated'
    publish:
      operationId: publishSettingsUpdated
      message:
        $ref: '#/components/messages/SettingsUpdated'
  blog.settings.cache.invalidated:
    subscribe:
      operationId: onSettingsCacheInvalidated
      message:
        $ref: '#/components/messages/SettingsCacheInvalidated'
    publish:
      operationId: publishSettingsCacheInvalidated
      message:
        $ref: '#/components/messages/SettingsCacheInvalidated'
  blog.settings.security.updated:
    subscribe:
      operationId: onSettingsSecurityUpdated
      message:
        $ref: '#/components/messages/SettingsSecurityUpdated'
    publish:
      operationId: publishSettingsSecurityUpdated
      message:
        $ref: '#/components/messages/SettingsSecurityUpdated'
  blog.impersonation.start_attempted:
    subscribe:
      operationId: onImpersonationStartAttempted
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
    publish:
      operationId: publishImpersonationStartAttempted
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
  blog.impersonation.started:
    subscribe:
      operationId: onImpersonationStarted
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
    publish:
      operationId: publishImpersonationStarted
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
  blog.impersonation.start_failed:
    subscribe:
      operationId: onImpersonationStartFailed
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
    publish:
      operationId: publishImpersonationStartFailed
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
  blog.impersonation.exited_manually:
    subscribe:
      operationId: onImpersonationExitedManually
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
    publish:
      operationId: publishImpersonationExitedManually
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
  blog.impersonation.expired:
    subscribe:
      operationId: onImpersonationExpired
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
    publish:
      operationId: publishImpersonationExpired
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
  blog.impersonation.revoked_by_policy:
    subscribe:
      operationId: onImpersonationRevokedByPolicy
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
    publish:
      operationId: publishImpersonationRevokedByPolicy
      message:
        $ref: '#/components/messages/ImpersonationLifecycle'
  blog.impersonation.action_performed:
    description: Optional high-grain event for audited business actions performed while impersonating.
    subscribe:
      operationId: onImpersonationActionPerformed
      message:
        $ref: '#/components/messages/ImpersonationActionPerformed'
    publish:
      operationId: publishImpersonationActionPerformed
      message:
        $ref: '#/components/messages/ImpersonationActionPerformed'
  blog.newsletter.issue.send_requested:
    description: Raised when a newsletter issue is queued (sent now, released by the scheduler at send_at, or
      resumed). The newsletter-dispatch consumer delivers it; redelivery is safe because each recipient is claimed
      before it is mailed.
    subscribe:
      operationId: onNewsletterIssueSendRequested
      tags:
      - name: newsletter
      - name: outbox
      message:
        $ref: '#/components/messages/NewsletterIssueSendRequested'
    publish:
      operationId: publishNewsletterIssueSendRequested
      tags:
      - name: newsletter
      - name: outbox
      message:
        $ref: '#/components/messages/NewsletterIssueSendRequested'
  blog.newsletter.subscriber.changed:
    description: Raised when a subscriber's consent state changes (confirmed, lists or format changed,
      unsubscribed, bounced, complained, erased). Carries ids only; the newsletter-provider-sync consumer
      (custom_http) reads the current state and pushes it to the provider.
    subscribe:
      operationId: onNewsletterSubscriberChanged
      tags:
      - name: newsletter
      - name: outbox
      message:
        $ref: '#/components/messages/NewsletterSubscriberChanged'
    publish:
      operationId: publishNewsletterSubscriberChanged
      tags:
      - name: newsletter
      - name: outbox
      message:
        $ref: '#/components/messages/NewsletterSubscriberChanged'
  blog.post.revision.created:
    description: Raised when a new post revision is appended (create/update/publish/archive/restore).
    subscribe:
      operationId: onPostRevisionCreated
      tags:
      - name: post
      - name: outbox
      message:
        $ref: '#/components/messages/PostRevisionCreated'
    publish:
      operationId: publishPostRevisionCreated
      tags:
      - name: post
      - name: outbox
      message:
        $ref: '#/components/messages/PostRevisionCreated'
  blog.post.revision.restored:
    description: Raised when a previous revision is successfully restored as the current post content.
    subscribe:
      operationId: onPostRevisionRestored
      tags:
      - name: post
      - name: outbox
      message:
        $ref: '#/components/messages/PostRevisionRestored'
    publish:
      operationId: publishPostRevisionRestored
      tags:
      - name: post
      - name: outbox
      message:
        $ref: '#/components/messages/PostRevisionRestored'
  blog.post.seo.updated:
    description: Raised when post SEO configuration is changed (fields, canonical, robots flags). Triggers SEO cache invalidation and sitemap updates.
    subscribe:
      operationId: onPostSEOUpdated
      tags:
      - name: post
      - name: outbox
      message:
        $ref: '#/components/messages/PostSEOUpdated'
    publish:
      operationId: publishPostSEOUpdated
      tags:
      - name: post
      - name: outbox
      message:
        $ref: '#/components/messages/PostSEOUpdated'
  blog.post.slug_changed:
    description: Raised when a post URL slug changes; consumers create redirect rules, update internal references, sitemaps, and analytics URL mapping.
    subscribe:
      operationId: onPostSlugChanged
      tags:
      - name: post
      - name: outbox
      message:
        $ref: '#/components/messages/PostSlugChanged'
    publish:
      operationId: publishPostSlugChanged
      tags:
      - name: post
      - name: outbox
      message:
        $ref: '#/components/messages/PostSlugChanged'
  notifications.user.{user_id}.stream:
    parameters:
      user_id:
        $ref: '#/components/parameters/user_id'
    description: Per-user notification fan-out (SSE and internal pub/sub).
    publish:
      operationId: publishNotificationToUserStream
      message:
        $ref: '#/components/messages/NotificationStreamMessage'
    subscribe:
      operationId: onNotificationStreamMessage
      security:
      - httpBearerAuth:
        - notifications.read
        - notifications.self.read
      message:
        $ref: '#/components/messages/NotificationStreamMessage'
    bindings:
      sse:
        bindingVersion: 0.2.0
        endpoint: /api/v1/me/notifications/stream
        method: GET
  analytics.admin.realtime.stream:
    description: Admin live activity and analytics SSE/pub-sub. Requires admin analytics permissions.
    publish:
      operationId: publishAdminRealtimeEvent
      message:
        $ref: '#/components/messages/AdminAnalyticsRealtime'
    subscribe:
      operationId: onAdminRealtimeEvent
      security:
      - httpBearerAuth:
        - analytics.read
        - analytics.realtime.read
      message:
        $ref: '#/components/messages/AdminAnalyticsRealtime'
    bindings:
      sse:
        bindingVersion: 0.2.0
        endpoint: /api/v1/admin/analytics/realtime/stream
        method: GET
  analytics.ingest.raw:
    description: Internal topic for raw analytics events after consent-gated ingestion HTTP endpoints.
    publish:
      operationId: publishAnalyticsRawEvent
      message:
        $ref: '#/components/messages/AnalyticsIngestRaw'
    subscribe:
      operationId: onAnalyticsRawEvent
      message:
        $ref: '#/components/messages/AnalyticsIngestRaw'
  analytics.consent.granted:
    description: A consent subject granted a purpose.
    subscribe:
      operationId: onAnalyticsConsentGranted
      tags:
      - name: analytics
      - name: outbox
      message:
        $ref: '#/components/messages/AnalyticsConsentChanged'
    publish:
      operationId: publishAnalyticsConsentGranted
      tags:
      - name: analytics
      - name: outbox
      message:
        $ref: '#/components/messages/AnalyticsConsentChanged'
  analytics.consent.rejected:
    description: A consent subject refused a purpose it had never granted.
    subscribe:
      operationId: onAnalyticsConsentRejected
      tags:
      - name: analytics
      - name: outbox
      message:
        $ref: '#/components/messages/AnalyticsConsentChanged'
    publish:
      operationId: publishAnalyticsConsentRejected
      tags:
      - name: analytics
      - name: outbox
      message:
        $ref: '#/components/messages/AnalyticsConsentChanged'
  analytics.consent.withdrawn:
    description: A consent subject revoked a purpose it had granted; ingestion for that purpose stops.
    subscribe:
      operationId: onAnalyticsConsentWithdrawn
      tags:
      - name: analytics
      - name: outbox
      message:
        $ref: '#/components/messages/AnalyticsConsentChanged'
    publish:
      operationId: publishAnalyticsConsentWithdrawn
      tags:
      - name: analytics
      - name: outbox
      message:
        $ref: '#/components/messages/AnalyticsConsentChanged'
  analytics.job.materialize_daily:
    description: Job topic for daily aggregate materialization jobs.
    subscribe:
      operationId: handleAnalyticsMaterializeDaily
      message:
        $ref: '#/components/messages/JobCommand'
    publish:
      operationId: scheduleAnalyticsMaterializeDaily
      message:
        $ref: '#/components/messages/JobCommand'
  analytics.job.erase_by_consent:
    description: Erase user data per withdrawn consent token.
    subscribe:
      operationId: handleAnalyticsEraseByConsent
      message:
        $ref: '#/components/messages/JobCommand'
    publish:
      operationId: scheduleAnalyticsEraseByConsent
      message:
        $ref: '#/components/messages/JobCommand'
  media.job.cleanup_orphan_transforms:
    description: Clean up cached media transforms that are past TTL.
    subscribe:
      operationId: handleCleanupOrphanTransforms
      message:
        $ref: '#/components/messages/JobCommand'
    publish:
      operationId: scheduleCleanupOrphanTransforms
      message:
        $ref: '#/components/messages/JobCommand'
  impersonation.job.expire_sessions:
    description: Periodic impersonation session expiry sweeper.
    subscribe:
      operationId: handleExpireImpersonationSessions
      message:
        $ref: '#/components/messages/JobCommand'
    publish:
      operationId: scheduleExpireImpersonationSessions
      message:
        $ref: '#/components/messages/JobCommand'
  settings.job.rebuild_cache:
    description: Rebuild settings cache after invalidation events.
    subscribe:
      operationId: handleSettingsRebuildCache
      message:
        $ref: '#/components/messages/JobCommand'
    publish:
      operationId: scheduleSettingsRebuildCache
      message:
        $ref: '#/components/messages/JobCommand'
  outbox.publish:
    description: Internal topic consumed by the Watermill outbox publisher; publishes transactional outbox rows on commit.
    subscribe:
      operationId: onOutboxPublish
      message:
        $ref: '#/components/messages/OutboxRecord'
    publish:
      operationId: publishOutboxRecord
      message:
        $ref: '#/components/messages/OutboxRecord'
  user.profile.updated:
    description: Self-service or admin edit of profile display/bio/contact/social/locale/timezone/marketing-consent fields.
    subscribe:
      operationId: onUserProfileUpdated
      message:
        $ref: '#/components/messages/UserProfileUpdated'
    publish:
      operationId: publishUserProfileUpdated
      message:
        $ref: '#/components/messages/UserProfileUpdated'
  user.profile.avatar_updated:
    description: Avatar attached, detached, or replaced on a user record.
    subscribe:
      operationId: onUserProfileAvatarUpdated
      message:
        $ref: '#/components/messages/UserAvatarUpdated'
    publish:
      operationId: publishUserProfileAvatarUpdated
      message:
        $ref: '#/components/messages/UserAvatarUpdated'
  user.password.changed:
    description: Authenticated password change completed successfully.
    subscribe:
      operationId: onUserPasswordChanged
      message:
        $ref: '#/components/messages/UserPasswordChanged'
    publish:
      operationId: publishUserPasswordChanged
      message:
        $ref: '#/components/messages/UserPasswordChanged'
  user.password.admin_reset_triggered:
    description: Admin triggered a password reset email or set force-password-on-next-login for a user.
    subscribe:
      operationId: onUserPasswordAdminResetTriggered
      message:
        $ref: '#/components/messages/UserPasswordAdminResetTriggered'
    publish:
      operationId: publishUserPasswordAdminResetTriggered
      message:
        $ref: '#/components/messages/UserPasswordAdminResetTriggered'
  auth.password.reset_requested:
    description: A password reset token was issued (forgot-password or admin reset). Attempts for unknown or inactive accounts record nothing.
    subscribe:
      operationId: onAuthPasswordResetRequested
      message:
        $ref: '#/components/messages/AuthPasswordResetRequested'
    publish:
      operationId: publishAuthPasswordResetRequested
      message:
        $ref: '#/components/messages/AuthPasswordResetRequested'
  user.password.reset_completed:
    description: Forgot-password reset token consumed and new password applied.
    subscribe:
      operationId: onUserPasswordResetCompleted
      message:
        $ref: '#/components/messages/UserPasswordResetCompleted'
    publish:
      operationId: publishUserPasswordResetCompleted
      message:
        $ref: '#/components/messages/UserPasswordResetCompleted'
  user.email.change_requested:
    description: User submitted new email address + password proof; verification email sent.
    subscribe:
      operationId: onUserEmailChangeRequested
      message:
        $ref: '#/components/messages/UserEmailChangeRequested'
    publish:
      operationId: publishUserEmailChangeRequested
      message:
        $ref: '#/components/messages/UserEmailChangeRequested'
  user.email.changed:
    description: Email change confirmed and applied; sessions invalidated.
    subscribe:
      operationId: onUserEmailChanged
      message:
        $ref: '#/components/messages/UserEmailChanged'
    publish:
      operationId: publishUserEmailChanged
      message:
        $ref: '#/components/messages/UserEmailChanged'
  user.email.change_cancelled:
    description: Pending email change cancelled by user via warning link.
    subscribe:
      operationId: onUserEmailChangeCancelled
      message:
        $ref: '#/components/messages/UserEmailChangeCancelled'
    publish:
      operationId: publishUserEmailChangeCancelled
      message:
        $ref: '#/components/messages/UserEmailChangeCancelled'
  user.privacy.updated:
    description: Any privacy-setting flag changed for a user.
    subscribe:
      operationId: onUserPrivacyUpdated
      message:
        $ref: '#/components/messages/UserPrivacyUpdated'
    publish:
      operationId: publishUserPrivacyUpdated
      message:
        $ref: '#/components/messages/UserPrivacyUpdated'
  user.activity.export_requested:
    description: User or admin requested a GDPR/CCPA activity CSV export.
    subscribe:
      operationId: onUserActivityExportRequested
      message:
        $ref: '#/components/messages/UserActivityExportRequested'
    publish:
      operationId: publishUserActivityExportRequested
      message:
        $ref: '#/components/messages/UserActivityExportRequested'
  user.activity.erasure_requested:
    description: User submitted a PII erasure request for activity history.
    subscribe:
      operationId: onUserActivityErasureRequested
      message:
        $ref: '#/components/messages/UserActivityErasureRequested'
    publish:
      operationId: publishUserActivityErasureRequested
      message:
        $ref: '#/components/messages/UserActivityErasureRequested'
  user.session.invalidated_family:
    description: Refresh token family was rotated/invalidated for a user (password change, email change, admin action).
    subscribe:
      operationId: onUserSessionInvalidatedFamily
      message:
        $ref: '#/components/messages/UserSessionInvalidatedFamily'
    publish:
      operationId: publishUserSessionInvalidatedFamily
      message:
        $ref: '#/components/messages/UserSessionInvalidatedFamily'
  user.consent.marketing_granted:
    description: User granted marketing consent via profile or sign-up.
    subscribe:
      operationId: onUserConsentMarketingGranted
      message:
        $ref: '#/components/messages/UserConsentMarketingGranted'
    publish:
      operationId: publishUserConsentMarketingGranted
      message:
        $ref: '#/components/messages/UserConsentMarketingGranted'
  user.consent.marketing_withdrawn:
    description: User withdrew marketing consent via profile or unsubscribe link.
    subscribe:
      operationId: onUserConsentMarketingWithdrawn
      message:
        $ref: '#/components/messages/UserConsentMarketingWithdrawn'
    publish:
      operationId: publishUserConsentMarketingWithdrawn
      message:
        $ref: '#/components/messages/UserConsentMarketingWithdrawn'
components:
  securitySchemes:
    httpBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT bearer token. Scopes: `notifications.read` (Read notifications); `notifications.self.read` (Read current user notifications (granted implicitly for self-service)); `analytics.read` (Read admin analytics); `analytics.realtime.read` (Subscribe to admin realtime stream).'
    userPassword:
      type: userPassword
  parameters:
    user_id:
      description: Authenticated user ID scoping a notification SSE stream
      schema:
        type: string
        format: uuid
  messageTraits:
    EventEnvelope:
      headers:
        type: object
        properties:
          id:
            type: string
            format: uuid
            description: Event id
          type:
            type: string
          source:
            type: string
            default: blog-api
          correlation_id:
            type: string
            description: Request or causation id
          causation_id:
            type: string
          timestamp:
            type: string
            format: date-time
          trace_id:
            type: string
            nullable: true
          aggregate_id:
            type: string
            format: uuid
          aggregate_type:
            type: string
          actor_id:
            type: string
            format: uuid
            nullable: true
          impersonator_id:
            type: string
            format: uuid
            nullable: true
          impersonation_session_id:
            type: string
            format: uuid
            nullable: true
  messages:
    PostCreated:
      traits:
      - $ref: '#/components/messageTraits/EventEnvelope'
      payload:
        $ref: '#/components/schemas/PostEventPayload'
    PostUpdated:
      traits:
      - $ref: '#/components/messageTraits/EventEnvelope'
      payload:
        $ref: '#/components/schemas/PostEventPayload'
    PostPublished:
      traits:
      - $ref: '#/components/messageTraits/EventEnvelope'
      payload:
        allOf:
        - $ref: '#/components/schemas/PostEventPayload'
        - type: object
          properties:
            published_at:
              type: string
              format: date-time
    PostArchived:
      traits:
      - $ref: '#/components/messageTraits/EventEnvelope'
      payload:
        $ref: '#/components/schemas/PostEventPayload'
    CommentCreated:
      traits:
      - $ref: '#/components/messageTraits/EventEnvelope'
      payload:
        $ref: '#/components/schemas/CommentEventPayload'
    CommentModerated:
      traits:
      - $ref: '#/components/messageTraits/EventEnvelope'
      payload:
        $ref: '#/components/schemas/CommentEventPayload'
