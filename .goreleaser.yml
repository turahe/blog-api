version: 2

project_name: blog-api

builds:
  - id: blog-api
    main: .
    binary: blog-api
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
    ldflags:
      - -s -w
      - -X github.com/turahe/blog-api/cmd.version={{.Version}}
      - -X github.com/turahe/blog-api/cmd.commit={{.Commit}}
      - -X github.com/turahe/blog-api/cmd.buildTime={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"
      - "^style"
