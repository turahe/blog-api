/api/v1/posts:
  get:
    tags:
    - Public
    summary: Public list of published posts
    security: []
    operationId: public.posts.list
    parameters:
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PerPage
    - name: category_id
      in: query
      schema:
        type: string
        format: uuid
    - name: tag_id
      in: query
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Paginated published posts
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostList
/api/v1/posts/{slug}:
  get:
    tags:
    - Public
    summary: Get single published post by slug with optional cover/media includes
    security: []
    operationId: public.posts.get
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
    - $ref: ../components/parameters.yaml#/IncludePostMedia
    responses:
      '200':
        description: Post detail
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostResponse
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
/api/v1/posts/{slug}/seo-meta:
  get:
    tags:
    - Public
    summary: Get structured SEO meta tags payload for SSR frontend rendering
    security: []
    operationId: public.posts.seo_meta
    description: Returns canonical title/description/OG/Twitter/robots meta payload for a published post. Cached aggressively; invalidated on post or SEO updates.
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: SEO meta tags
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostSEOMetaPublic
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
/api/v1/posts/{id}/comments:
  post:
    tags:
    - Public
    summary: Create a new comment on a post
    security: []
    operationId: public.posts.comments.create
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/posts.yaml#/CommentCreateRequest
    responses:
      '201':
        description: Comment created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopeCommentResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationError
/api/v1/admin/posts:
  get:
    tags:
    - Admin / Posts
    summary: Admin list posts
    operationId: admin.posts.list
    parameters:
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PerPage
    - name: status
      in: query
      schema:
        type: string
        enum:
        - draft
        - scheduled
        - published
        - archived
    - name: author_id
      in: query
      schema:
        type: string
        format: uuid
    - name: category_id
      in: query
      schema:
        type: string
        format: uuid
    - name: q
      in: query
      schema:
        type: string
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostList
        description: OK
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
  post:
    tags:
    - Admin / Posts
    summary: Create a new post with optional media associations
    operationId: admin.posts.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/posts.yaml#/PostCreateRequest
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationError
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
/api/v1/admin/posts/{id}:
  patch:
    tags:
    - Admin / Posts
    summary: Update post content fields
    operationId: admin.posts.update
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/posts.yaml#/PostUpdateRequest
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationError
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
      '409':
        description: Slug conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Common.yaml#/EnvelopeError
/api/v1/admin/posts/{id}/publish:
  post:
    tags:
    - Admin / Posts
    summary: Publish a post
    operationId: admin.posts.publish
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Published
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
/api/v1/admin/posts/{id}/media:
  patch:
    tags:
    - Admin / Posts
    summary: Replace post_media join rows for a post (cover + ordered attachments)
    operationId: admin.posts.media.replace
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/posts.yaml#/PostMediaReplaceRequest
    responses:
      '200':
        description: Replace successful
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostMediaResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
/api/v1/admin/posts/{id}/revisions:
  get:
    tags:
    - Admin / Posts
    summary: List post revisions with pagination and filters
    operationId: admin.posts.revisions.list
    description: Returns paginated revision summaries. Requires post.revisions.view or ownership.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/PerPage
    - name: author_id
      in: query
      schema:
        type: string
        format: uuid
    - name: from_date
      in: query
      schema:
        type: string
        format: date-time
    - name: to_date
      in: query
      schema:
        type: string
        format: date-time
    - name: include_diff
      in: query
      schema:
        type: boolean
        default: true
    responses:
      '200':
        description: Paginated revisions
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostRevisionList
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
/api/v1/admin/posts/{id}/revisions/{revisionIdOrNumber}:
  get:
    tags:
    - Admin / Posts
    summary: Get a single post revision (full snapshot + diff)
    operationId: admin.posts.revisions.get
    description: Accepts either a UUID revision_id or an integer revision_number as the path parameter.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: revisionIdOrNumber
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Full revision with snapshot, diff, changelog
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostRevisionResponse
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
/api/v1/admin/posts/{id}/revisions/{revisionIdOrNumber}/restore:
  post:
    tags:
    - Admin / Posts
    summary: Restore a previous revision as a new revision
    operationId: admin.posts.revisions.restore
    description: Creates a new type=restore revision with restore_from_revision_id set, then updates post content/seo/media/tags/slug/status accordingly. Requires CSRF header.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: revisionIdOrNumber
      in: path
      required: true
      schema:
        type: string
    - $ref: ../components/parameters.yaml#/XCsrfToken
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              restore_note:
                type: string
                maxLength: 500
    responses:
      '200':
        description: Restore completed; returns new revision + updated post
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostRevisionRestoreResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationError
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
      '409':
        $ref: ../components/responses.yaml#/ValidationError
/api/v1/admin/posts/{id}/seo:
  get:
    tags:
    - Admin / Posts
    summary: Get SEO configuration for a post with soft warnings
    operationId: admin.posts.seo.get
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: SEO config plus warnings array in meta
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostSEOResponse
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
  put:
    tags:
    - Admin / Posts
    summary: Update SEO configuration (and/or slug) for a post
    operationId: admin.posts.seo.update
    description: Partial update with allowlisted fields. Triggers new revision and emits seo.updated/slug_changed events.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/posts.yaml#/PostSEOUpdateRequest
    responses:
      '200':
        description: Updated SEO config; warnings in meta
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostSEOResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationError
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
      '409':
        $ref: ../components/responses.yaml#/ValidationError
/api/v1/admin/posts/{id}/seo/preview:
  post:
    tags:
    - Admin / Posts
    summary: Live SERP / Open Graph / Twitter card preview for draft SEO
    operationId: admin.posts.seo.preview
    description: Accepts unsaved draft SEO (plus optional draft title/excerpt/cover) and returns rendered previews with warnings.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/posts.yaml#/PostSEOPreviewRequest
    responses:
      '200':
        description: Preview payload (search/OG/Twitter) + warnings
        content:
          application/json:
            schema:
              $ref: ../components/schemas/posts.yaml#/EnvelopePostSEOPreviewResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationError
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
