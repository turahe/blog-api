/api/v1/categories:
  get:
    tags:
    - Public
    summary: List public categories, optionally include cover image
    security: []
    operationId: public.categories.list
    parameters:
    - $ref: ../components/parameters.yaml#/IncludeCategoryImage
    responses:
      '200':
        description: Categories list
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Categories.yaml#/EnvelopeCategoryList
/api/v1/categories/{slug}:
  get:
    tags:
    - Public
    summary: Get single category
    security: []
    operationId: public.categories.get
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
    - $ref: ../components/parameters.yaml#/IncludeCategoryImage
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Categories.yaml#/EnvelopeCategoryResponse
        description: OK
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
/api/v1/admin/categories:
  get:
    tags:
    - Admin
    summary: List categories (tree order)
    operationId: admin.categories.list
    security:
    - bearerAuth: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Categories.yaml#/EnvelopeCategoryList
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
  post:
    tags:
    - Admin
    summary: Create category
    operationId: admin.categories.create
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Categories.yaml#/CategoryCreateRequest
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Categories.yaml#/EnvelopeCategoryResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationError
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '409':
        description: Conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Common.yaml#/EnvelopeError
/api/v1/admin/categories/{id}:
  parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  patch:
    tags:
    - Admin
    operationId: admin.categories.update
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Categories.yaml#/CategoryUpdateRequest
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Categories.yaml#/EnvelopeCategoryResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationError
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
      '409':
        description: Conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Common.yaml#/EnvelopeError
  delete:
    tags:
    - Admin
    operationId: admin.categories.delete
    security:
    - bearerAuth: []
    responses:
      '204':
        description: Deleted
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
      '409':
        description: Category in use
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Common.yaml#/EnvelopeError
/api/v1/admin/categories/{id}/move:
  post:
    tags:
    - Admin
    operationId: admin.categories.move
    security:
    - bearerAuth: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Categories.yaml#/CategoryMoveRequest
    responses:
      '200':
        description: Moved category
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Categories.yaml#/EnvelopeCategoryResponse
      '400':
        $ref: ../components/responses.yaml#/ValidationError
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
      '404':
        $ref: ../components/responses.yaml#/NotFoundError
