/api/v1/admin/analytics/export:
  post:
    tags:
    - Admin / Analytics
    summary: Export analytics data for a given window (requires export permission + stepup if configured)
    operationId: admin.analytics.export
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - format
            - start_date
            - end_date
            properties:
              format:
                type: string
                enum:
                - csv
                - json
              start_date:
                type: string
                format: date
              end_date:
                type: string
                format: date
    responses:
      '200':
        description: Export data or job accepted
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Admin.yaml#/EnvelopeAnalyticsExport
      '401':
        $ref: ../components/responses.yaml#/UnauthorizedError
      '403':
        $ref: ../components/responses.yaml#/ForbiddenError
