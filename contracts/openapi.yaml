          - r2
          - minio
          - do_spaces
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        uploaded_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EnvelopeMediaResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/MediaAsset'
    EnvelopeMediaList:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
