      responses:
        '200':
          description: Email updated; refresh token family invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/me/privacy:
    get:
      tags:
      - Self-Service
      summary: Read current user privacy settings
      operationId: me.privacy.get
      responses:
        '200':
          description: Privacy settings for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserPrivacyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      tags:
      - Self-Service
      summary: Update current user privacy settings (allowlisted flags only)
      operationId: me.privacy.update
      parameters:
      - $ref: '#/components/parameters/XCsrfToken'
      - $ref: '#/components/parameters/XReVerifyPassword'
      - $ref: '#/components/parameters/X2FAVerified'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPrivacyUpdateRequest'
      responses:
        '200':
          description: Privacy settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserPrivacyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/me/activity:
    get:
      tags:
      - Self-Service
      summary: List current user engagement activity timeline
      operationId: me.activity.list
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPageMax100'
      - name: category
        in: query
        description: Filter by one or more activity types. Repeat or CSV for multiple.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UserActivityType'
      - name: from_date
        in: query
        schema:
          type: string
          format: date-time
      - name: to_date
        in: query
        schema:
          type: string
          format: date-time
      - name: export
        in: query
        description: Set csv to stream a CSV download of the full result set.
        schema:
          type: string
          enum:
          - csv
      responses:
        '200':
          description: Paginated activity list or CSV stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserActivityList'
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/activity/export:
    get:
      tags:
      - Self-Service
      summary: Queue GDPR/CCPA activity CSV export for the authenticated user
      operationId: me.activity.export
      responses:
        '202':
          description: Export job queued; download URL delivered via in-app notification and email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeActivityExportAccepted'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/activity/erase:
    post:
      tags:
      - Self-Service
      summary: Submit GDPR/CCPA request to erase PII from user activity history
      operationId: me.activity.erase
      parameters:
      - $ref: '#/components/parameters/XCsrfToken'
      - $ref: '#/components/parameters/XReVerifyPassword'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityEraseRequest'
      responses:
        '202':
          description: Erasure request accepted; job scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeEmpty'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/users/{usernameOrId}:
    get:
      tags:
      - Public
      summary: Public user profile page respecting user privacy settings
      description: 'Returns privacy-filtered public profile. Returns 404 if the user has a private profile or does not exist, to avoid leaking existence. Include avatar,posts_preview,roles_brief via include comma-joined.

        '
      security: []
      operationId: public.users.profile
      parameters:
      - name: usernameOrId
        in: path
        required: true
        schema:
          type: string
      - name: include
        in: query
        description: 'Comma-separated includes: avatar, posts_preview, roles_brief'
        schema:
          type: string
      responses:
        '200':
          description: Public profile payload filtered by privacy settings
          headers:
            X-Robots-Tag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePublicUserProfile'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/users/{id}/profile:
    get:
      tags:
      - Admin / Users
      summary: Admin read full user profile including privacy and summary activity counts
      operationId: admin.users.profile.get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Full user + profile + privacy + summary activity counts (admin-only view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAdminUserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
      - Admin / Users
      summary: Admin forcibly update user profile or privacy flags (requires 2FA step-up)
      operationId: admin.users.profile.patch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserProfilePatchRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Admin profile update applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAdminUserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/users/{id}/password/admin-reset:
    post:
      tags:
      - Admin / Users
      summary: Admin trigger password reset email or force-password-on-next-login
      operationId: admin.users.password.admin_reset
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserPasswordResetRequest'
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Reset triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeEmpty'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/users/{id}/activity:
    get:
      tags:
      - Admin / Users
      summary: Admin read full activity log for target user (ignores target privacy)
      operationId: admin.users.activity.list
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPageMax100'
      - name: category
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UserActivityType'
      - name: from_date
        in: query
        schema:
          type: string
          format: date-time
      - name: to_date
        in: query
        schema:
          type: string
          format: date-time
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Full activity log including full IP / detail JSONB for admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserActivityList'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token, 15 minute TTL. Refresh via /api/v1/auth/refresh with 30-day refresh token.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    IncludeAvatar:
      name: include
      in: query
      description: Comma-separated includes; value `avatar` expands user avatar media
      schema:
        type: string
    IncludePostMedia:
      name: include
      in: query
      description: Comma-separated includes; `cover` or `media` or `cover,media`
      schema:
        type: string
    IncludeCategoryImage:
      name: include
      in: query
      description: Comma-separated includes; `image` expands category cover media
      schema:
        type: string
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    XReVerifyPassword:
      name: X-Re-Verify-Password
      in: header
      required: false
      schema:
        type: string
      description: Current user password proof for high-risk actions (step-up).
    X2FAVerified:
      name: X-2FA-Verified
      in: header
      required: false
      schema:
        type: string
      description: 'Opaque token returned by /api/v1/auth/2fa/challenge within the last 5 minutes, proving step-up for high-risk actions.

        '
    PerPageMax100:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    EmptyOk:
      description: Empty success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeEmpty'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'
    ForbiddenError:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'
    TooManyRequests:
      description: Rate limit exceeded (default 100/min per client)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeError'
  schemas:
    EnvelopeEmpty:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: object
            nullable: true
            default: null
    EnvelopeError:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - error
        properties:
          data:
            nullable: true
          error:
            $ref: '#/components/schemas/Error'
    Envelope:
      type: object
      required:
      - meta
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Error'
    Meta:
      type: object
      properties:
        request_id:
          type: string
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        window:
          type: string
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          examples:
          - validation_error
          - unauthorized
          - forbidden
          - not_found
          - too_many_requests
          - conflict
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        remember:
          type: boolean
          default: false
    TokenPair:
      type: object
      required:
      - access_token
      - refresh_token
      properties:
        access_token:
          type: string
          format: jwt
          description: 15-minute JWT access token
        refresh_token:
          type: string
          description: 30-day refresh token
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: seconds until access token expiry
          default: 900
    EnvelopeTokenResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/TokenPair'
    User:
      type: object
      required:
      - id
      - full_name
      - email
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - active
          - inactive
          - suspended
        avatar_id:
          type: string
          format: uuid
          nullable: true
        avatar:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/MediaAsset'
        last_login_at:
          type: string
          format: date-time
          nullable: true
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EnvelopeUserResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/User'
    EnvelopeUserList:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    ProfileUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/UserProfileExtension'
      - type: object
        properties:
          full_name:
            type: string
            minLength: 1
            maxLength: 150
    UserCreateRequest:
      type: object
      required:
      - full_name
      - email
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        status:
          type: string
          enum:
          - active
          - inactive
          default: active
        role_ids:
          type: array
          items:
            type: string
            format: uuid
    Notification:
      type: object
      required:
      - id
      - type
      - title
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        preview:
          type: string
          nullable: true
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
    EnvelopeNotificationList:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
    Post:
      type: object
      required:
      - id
      - title
      - slug
      - status
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        content:
          type: string
        cover_image_media_id:
          type: string
          format: uuid
          nullable: true
        cover:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/MediaAsset'
        status:
          type: string
          enum:
          - draft
          - review
          - published
          - archived
        published_at:
          type: string
          format: date-time
          nullable: true
        media:
          type: array
          items:
            $ref: '#/components/schemas/PostMediaItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PostMediaItem:
      type: object
      properties:
        media_asset_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - cover
          - inline_image
          - attachment
        sort_order:
          type: integer
        media:
          $ref: '#/components/schemas/MediaAsset'
    EnvelopePostResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Post'
    EnvelopePostList:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    PostCreateRequest:
      type: object
      required:
      - title
      - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
        category_id:
          type: string
          format: uuid
          nullable: true
        cover_image_media_id:
          type: string
          format: uuid
          nullable: true
        excerpt:
          type: string
        content:
          type: string
        seo:
          $ref: '#/components/schemas/PostSEOConfig'
        status:
          type: string
          enum:
          - draft
          - review
          - published
          - archived
          default: draft
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        media:
          type: array
          items:
            type: object
            required:
            - media_asset_id
            - kind
            properties:
              media_asset_id:
                type: string
                format: uuid
              kind:
                type: string
                enum:
                - cover
                - inline_image
                - attachment
              sort_order:
                type: integer
    PostMediaReplaceRequest:
      type: object
      required:
      - items
      properties:
        enforce_cover_consistency:
          type: boolean
          default: true
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/PostMediaItem'
    EnvelopePostMediaResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - post_id
            - items
            properties:
              post_id:
                type: string
                format: uuid
              items:
                type: array
                items:
                  $ref: '#/components/schemas/PostMediaItem'
    Comment:
      type: object
      required:
      - id
      - post_id
      - content
      - status
      properties:
        id:
