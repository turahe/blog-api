          format: uuid
        post_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        author_name:
          type: string
          nullable: true
        author_email:
          type: string
          format: email
          nullable: true
        content:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - spam
        created_at:
          type: string
          format: date-time
    CommentCreateRequest:
      type: object
      required:
      - content
      properties:
        parent_id:
          type: string
          format: uuid
          nullable: true
        author_name:
          type: string
        author_email:
          type: string
          format: email
        author_website:
          type: string
          format: uri
        content:
          type: string
          minLength: 1
    EnvelopeCommentResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Comment'
    Category:
      type: object
      required:
      - id
      - name
      - slug
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        image_id:
          type: string
          format: uuid
          nullable: true
        image:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/MediaAsset'
        lft:
          type: integer
        rgt:
          type: integer
        depth:
          type: integer
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EnvelopeCategoryList:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    EnvelopeCategoryResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Category'
    Tag:
      type: object
      required:
      - id
      - name
      - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
    EnvelopeTagList:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - items
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
    MediaAsset:
      type: object
      required:
      - id
      - storage_key
      - content_type
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        storage_key:
          type: string
        original_filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        checksum_sha256:
          type: string
          nullable: true
        disk:
          type: string
          enum:
