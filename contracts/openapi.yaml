openapi: 3.1.0
info:
  title: Blog Platform REST API
  summary: Backend REST API for a blog platform with authentication, RBAC, content management, media, analytics, settings, impersonation, and admin tooling.
  description: 'This OpenAPI contract documents all synchronous HTTP endpoints for the blog backend.

    It aligns with the project''s hexagonal modular architecture and the docs under `docs/backend` and `docs/features`.

    '
  contact:
    name: Platform Team
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Local Docker Compose environment
- url: https://api.example.com
  description: Production
tags:
- name: Auth
  description: Authentication, tokens, 2FA, OAuth
- name: Self-Service
  description: Authenticated user profile, notifications, and per-user actions
- name: Public
  description: Public content read APIs
- name: Admin / Auth
  description: Admin-only login flows
- name: Admin / Users
  description: Admin user management
- name: Admin / Posts
  description: Admin post CRUD and workflow
- name: Admin / Media
  description: Admin media and post-media associations
- name: Admin / Settings
  description: Admin settings management
- name: Admin / Impersonation
  description: Superadmin-only impersonation lifecycle
- name: Admin / Analytics
  description: Admin analytics dashboard APIs
- name: Consent & Analytics Ingestion
  description: Privacy-conscious analytics ingest and consent management
- name: Health
  description: Public and internal health endpoints
- name: Public / Users
  description: Public user profile display endpoint
security:
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login with email/password
      description: Exchange credentials for JWT access and refresh tokens.
      security: []
      operationId: auth.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh access token using refresh token
      security: []
      operationId: auth.refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
                  format: jwt
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout current session
      operationId: auth.logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/EmptyOk'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/auth/2fa/challenge:
    post:
      tags:
      - Auth
      summary: Submit 2FA challenge or prove step-up for high-risk actions
      operationId: auth.2fa.challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - challenge_type
              - proof
              properties:
                challenge_type:
                  type: string
                  enum:
                  - totp
                  - backup_code
                  - stepup_proof
                proof:
                  type: string
      responses:
        '200':
          description: Challenge verified; returns short-lived stepup scope or status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope2FAStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/oauth/{provider}/callback:
    post:
      tags:
      - Auth
      summary: OAuth/OIDC callback handler for social login providers
      security: []
      operationId: auth.oauth.callback
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - github
          - oidc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - state
              properties:
                code:
                  type: string
                state:
                  type: string
                nonce:
                  type: string
                link_with_current_user:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Social login success or linking success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/me:
    get:
      tags:
      - Self-Service
      summary: Current user profile including optional avatar media
      operationId: me.get
      parameters:
      - $ref: '#/components/parameters/IncludeAvatar'
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/me/profile:
    patch:
      tags:
      - Self-Service
      summary: Update current user profile
      operationId: me.profile.patch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/me/notifications:
    get:
      tags:
      - Self-Service
      summary: List notifications for the current user
      operationId: me.notifications.list
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeNotificationList'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/me/notifications/{id}/read:
    post:
      tags:
      - Self-Service
      summary: Mark a notification read
      operationId: me.notifications.read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/EmptyOk'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/me/notifications/stream:
    get:
      tags:
      - Self-Service
      summary: SSE stream of real-time notifications for the current user
      description: SSE stream producing user-scoped notification events. See `contracts/asyncapi.yaml` for event payloads.
      operationId: me.notifications.stream
      responses:
        '200':
          description: text/event-stream with keep-alives and events
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/v1/posts:
    get:
      tags:
      - Public
      summary: Public list of published posts
      security: []
      operationId: public.posts.list
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: category_id
        in: query
        schema:
          type: string
          format: uuid
      - name: tag_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paginated published posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostList'
  /api/v1/posts/{slug}:
    get:
      tags:
      - Public
      summary: Get single published post by slug with optional cover/media includes
      security: []
      operationId: public.posts.get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IncludePostMedia'
      responses:
        '200':
          description: Post detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/posts/{slug}/seo-meta:
    get:
      tags:
      - Public
      summary: Get structured SEO meta tags payload for SSR frontend rendering
      security: []
      operationId: public.posts.seo_meta
      description: Returns canonical title/description/OG/Twitter/robots meta payload for a published post. Cached aggressively; invalidated on post or SEO updates.
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SEO meta tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostSEOMetaPublic'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/posts/{id}/comments:
    post:
      tags:
      - Public
      summary: Create a new comment on a post
      security: []
      operationId: public.posts.comments.create
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCommentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/categories:
    get:
      tags:
      - Public
      summary: List public categories, optionally include cover image
      security: []
      operationId: public.categories.list
      parameters:
      - $ref: '#/components/parameters/IncludeCategoryImage'
      responses:
        '200':
          description: Categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCategoryList'
  /api/v1/categories/{slug}:
    get:
      tags:
      - Public
      summary: Get single category
      security: []
      operationId: public.categories.get
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IncludeCategoryImage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeCategoryResponse'
          description: OK
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/tags:
    get:
      tags:
      - Public
      summary: List tags
      security: []
      operationId: public.tags.list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTagList'
          description: OK
  /api/v1/media/{id}:
    get:
      tags:
      - Public
      summary: Get metadata for a single media asset (redirect or signed URL depending on implementation)
      security: []
      operationId: public.media.get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeMediaResponse'
          description: OK
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/media/{id}/transform:
    get:
      tags:
      - Public
      summary: On-the-fly image transform endpoint
      security: []
      operationId: public.media.transform
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: w
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 8192
      - name: h
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 8192
      - name: fit
        in: query
        schema:
          type: string
          enum:
          - cover
          - contain
          - fill
          - inside
          - outside
          default: cover
      - name: format
        in: query
        schema:
          type: string
          enum:
          - jpeg
          - png
          - webp
          - avif
          default: webp
      - name: quality
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 82
      - name: rotate
        in: query
        schema:
          type: integer
          enum:
          - 0
          - 90
          - 180
          - 270
      - name: crop
        in: query
        description: Optional crop window JSON (x,y,w,h)
        schema:
          type: string
      responses:
        '200':
          description: Transformed image response with cache headers
          content:
            image/*:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/auth/login:
    post:
      tags:
      - Admin / Auth
      summary: Admin login endpoint for the backoffice
      security: []
      operationId: admin.auth.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Admin tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/users:
    get:
      tags:
      - Admin / Users
      summary: List users (admins)
      operationId: admin.users.list
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/IncludeAvatar'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserList'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
      - Admin / Users
      summary: Create a new user
      operationId: admin.users.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/posts:
    get:
      tags:
      - Admin / Posts
      summary: Admin list posts
      operationId: admin.posts.list
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - draft
          - review
          - published
          - archived
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostList'
          description: OK
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
      - Admin / Posts
      summary: Create a new post with optional media associations
      operationId: admin.posts.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/v1/admin/posts/{id}/publish:
    post:
      tags:
      - Admin / Posts
      summary: Publish a post
      operationId: admin.posts.publish
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/posts/{id}/media:
    patch:
      tags:
      - Admin / Posts
      summary: Replace post_media join rows for a post (cover + ordered attachments)
      operationId: admin.posts.media.replace
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMediaReplaceRequest'
      responses:
        '200':
          description: Replace successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostMediaResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/posts/{id}/revisions:
    get:
      tags:
      - Admin / Posts
      summary: List post revisions with pagination and filters
      operationId: admin.posts.revisions.list
      description: Returns paginated revision summaries. Requires post.revisions.view or ownership.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: author_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from_date
        in: query
        schema:
          type: string
          format: date-time
      - name: to_date
        in: query
        schema:
          type: string
          format: date-time
      - name: include_diff
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Paginated revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostRevisionList'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/posts/{id}/revisions/{revisionIdOrNumber}:
    get:
      tags:
      - Admin / Posts
      summary: Get a single post revision (full snapshot + diff)
      operationId: admin.posts.revisions.get
      description: Accepts either a UUID revision_id or an integer revision_number as the path parameter.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revisionIdOrNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Full revision with snapshot, diff, changelog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostRevisionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /api/v1/admin/posts/{id}/revisions/{revisionIdOrNumber}/restore:
    post:
      tags:
      - Admin / Posts
      summary: Restore a previous revision as a new revision
      operationId: admin.posts.revisions.restore
      description: Creates a new type=restore revision with restore_from_revision_id set, then updates post content/seo/media/tags/slug/status accordingly. Requires CSRF header.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revisionIdOrNumber
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                restore_note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Restore completed; returns new revision + updated post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostRevisionRestoreResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/posts/{id}/seo:
    get:
      tags:
      - Admin / Posts
      summary: Get SEO configuration for a post with soft warnings
      operationId: admin.posts.seo.get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: SEO config plus warnings array in meta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostSEOResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
      - Admin / Posts
      summary: Update SEO configuration (and/or slug) for a post
      operationId: admin.posts.seo.update
      description: Partial update with allowlisted fields. Triggers new revision and emits seo.updated/slug_changed events.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostSEOUpdateRequest'
      responses:
        '200':
          description: Updated SEO config; warnings in meta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostSEOResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/posts/{id}/seo/preview:
    post:
      tags:
      - Admin / Posts
      summary: Live SERP / Open Graph / Twitter card preview for draft SEO
      operationId: admin.posts.seo.preview
      description: Accepts unsaved draft SEO (plus optional draft title/excerpt/cover) and returns rendered previews with warnings.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostSEOPreviewRequest'
      responses:
        '200':
          description: Preview payload (search/OG/Twitter) + warnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePostSEOPreviewResponse'
        '400':
