openapi: 3.1.0
info:
  title: Blog Platform REST API
  summary: Backend REST API for a blog platform with authentication, RBAC, content management, media, analytics, settings, impersonation, and admin tooling.
  description: |
    This OpenAPI contract documents all synchronous HTTP endpoints for the blog backend.
    It aligns with the project's hexagonal modular architecture and the docs under `docs/backend` and `docs/features`.
  contact:
    name: Platform Team
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Docker Compose environment
  - url: https://api.example.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication, tokens, 2FA, OAuth
  - name: Self-Service
    description: Authenticated user profile, notifications, and per-user actions
  - name: Public
    description: Public content read APIs
  - name: Admin / Auth
    description: Admin-only login flows
  - name: Admin / Users
    description: Admin user management
  - name: Admin / Posts
    description: Admin post CRUD and workflow
  - name: Admin / Tags
    description: Admin tag CRUD and merge
  - name: Admin / Media
    description: Admin media and post-media associations
  - name: Admin / Settings
    description: Admin settings management
  - name: Admin / Impersonation
    description: Superadmin-only impersonation lifecycle
  - name: Admin / Analytics
    description: Admin analytics dashboard APIs
  - name: Consent & Analytics Ingestion
    description: Privacy-conscious analytics ingest and consent management
  - name: Health
    description: Public and internal health endpoints
  - name: Public / Users
    description: Public user profile display endpoint
  - name: Public / Newsletter
    description: Public subscribe, double-opt-in confirm/resend, unsubscribe, and preferences endpoints
  - name: Admin / Moderation
    description: Comment moderation (queue, bulk actions, triage) and spam review APIs
  - name: Admin / Newsletter
    description: Newsletter subscriber management, issues (draft/schedule/send), and ESP provider config
paths:
  /api/v1/me:
    get:
      tags:
        - Self-Service
      summary: Current user profile including optional avatar media
      operationId: me.get
      parameters:
        - name: include
          in: query
          description: Comma-separated includes; value `avatar` expands user avatar media
          schema: &ref_7
            type: string
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                allOf: &ref_4
                  - type: object
                    required: &ref_0
                      - meta
                    properties: &ref_1
                      data: {}
                      meta:
                        type: object
                        properties: &ref_42
                          request_id:
                            type: string
                          page:
                            type: integer
                          per_page:
                            type: integer
                          total:
                            type: integer
                          window:
                            type: string
                      error:
                        nullable: true
                        allOf:
                          - type: object
                            required: &ref_2
                              - code
                              - message
                            properties: &ref_3
                              code:
                                type: string
                                examples:
                                  - validation_error
                                  - unauthorized
                                  - forbidden
                                  - not_found
                                  - too_many_requests
                                  - conflict
                              message:
                                type: string
                              details:
                                type: object
                                additionalProperties: true
                  - type: object
                    properties:
                      data:
                        type: object
                        required: &ref_8
                          - id
                          - full_name
                          - email
                        properties: &ref_9
                          id:
                            type: string
                            format: uuid
                          full_name:
                            type: string
                          email:
                            type: string
                            format: email
                          status:
                            type: string
                            enum:
                              - active
                              - inactive
                              - suspended
                          avatar_id:
                            type: string
                            format: uuid
                            nullable: true
                          avatar:
                            nullable: true
                            allOf:
                              - type: object
                                required: &ref_14
                                  - id
                                  - storage_key
                                  - content_type
                                properties: &ref_15
                                  id:
                                    type: string
                                    format: uuid
                                  parent_id:
                                    type: string
                                    format: uuid
                                    nullable: true
                                  storage_key:
                                    type: string
                                  original_filename:
                                    type: string
                                  content_type:
                                    type: string
                                  size_bytes:
                                    type: integer
                                    minimum: 0
                                  width:
                                    type: integer
                                    nullable: true
                                  height:
                                    type: integer
                                    nullable: true
                                  checksum_sha256:
                                    type: string
                                    nullable: true
                                  disk:
                                    type: string
                                    enum:
                                      - s3
                                      - r2
                                      - minio
                                      - do_spaces
                                  tags:
                                    type: array
                                    items:
                                      type: string
                                  metadata:
                                    type: object
                                    additionalProperties: true
                                  uploaded_by:
                                    type: string
                                    format: uuid
                                    nullable: true
                                  created_at:
                                    type: string
                                    format: date-time
                                  updated_at:
                                    type: string
                                    format: date-time
                          last_login_at:
                            type: string
                            format: date-time
                            nullable: true
                          email_verified_at:
                            type: string
                            format: date-time
                            nullable: true
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
        '401':
          description: Authentication required
          content: &ref_6
            application/json:
              schema:
                allOf: &ref_5
                  - type: object
                    required: *ref_0
                    properties: *ref_1
                  - type: object
                    required:
                      - error
                    properties:
                      data:
                        nullable: true
                      error:
                        type: object
                        required: *ref_2
                        properties: *ref_3
  /api/v1/me/profile:
    patch:
      tags:
        - Self-Service
      summary: Update current user profile
      operationId: me.profile.patch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: &ref_154
                - type: object
                  properties: &ref_25
                    display_name:
                      type: string
                      minLength: 1
                      maxLength: 60
                      nullable: true
                    bio:
                      type: string
                      maxLength: 4000
                      nullable: true
                      description: Sanitized markdown.
                    contact:
                      type: object
                      properties: &ref_27
                        phone:
                          type: string
                          nullable: true
                          description: E.164 format, encrypted at rest. Returned only to owner or admin.
                        website:
                          type: string
                          format: uri
                          maxLength: 2048
                          nullable: true
                        location:
                          type: string
                          maxLength: 120
                          nullable: true
                    social_links:
                      type: object
                      properties: &ref_24
                        twitter:
                          type: string
                          nullable: true
                        linkedin:
                          type: string
                          nullable: true
                        github:
                          type: string
                          nullable: true
                    locale:
                      type: string
                      pattern: ^[A-Za-z]{2,3}(?:_[A-Za-z]{4})?(?:_[A-Za-z]{2}|[0-9]{3})?$
                      default: en_US
                    timezone:
                      type: string
                      default: UTC
                    marketing_consent:
                      type: boolean
                      default: false
                    marketing_consent_updated_at:
                      type: string
                      format: date-time
                      nullable: true
                - type: object
                  properties:
                    full_name:
                      type: string
                      minLength: 1
                      maxLength: 150
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                allOf: *ref_4
        '400':
          description: Validation error
          content: &ref_11
            application/json:
              schema:
                allOf: *ref_5
        '401':
          description: Authentication required
          content: *ref_6
        '403':
          description: Permission denied
          content: &ref_10
            application/json:
              schema:
                allOf: *ref_5
  /api/v1/admin/users:
    get:
      tags:
        - Admin / Users
      summary: List users (admins)
      operationId: admin.users.list
      parameters:
        - name: page
          in: query
          schema: &ref_22
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema: &ref_33
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: include
          in: query
          description: Comma-separated includes; value `avatar` expands user avatar media
          schema: *ref_7
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                allOf: &ref_131
                  - type: object
                    required: *ref_0
                    properties: *ref_1
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - items
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              required: *ref_8
                              properties: *ref_9
        '401':
          description: Authentication required
          content: *ref_6
        '403':
          description: Permission denied
          content: *ref_10
    post:
      tags:
        - Admin / Users
      summary: Create a new user
      operationId: admin.users.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &ref_169
                - full_name
                - email
              properties: &ref_170
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                  default: active
                role_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf: *ref_4
        '400':
          description: Validation error
          content: *ref_11
        '401':
          description: Authentication required
          content: *ref_6
        '403':
          description: Permission denied
          content: *ref_10
  /api/v1/auth/password/forgot:
    post:
      tags:
        - Auth
      summary: Request password reset email
      description: Timing-safe password reset request. Returns identical response for existing or non-existing emails to prevent enumeration. Rate limited.
      security: []
      operationId: auth.password.forgot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &ref_137
                - email_or_username
              properties: &ref_138
                email_or_username:
                  type: string
                  minLength: 3
                  maxLength: 254
                captcha_token:
                  type: string
                  description: Optional captcha token when rate limits prompt for proof of humanity.
      responses:
        '202':
          description: Accepted. If account exists a reset email has been sent.
          content:
            application/json:
              schema:
                allOf: &ref_12
                  - type: object
                    required: *ref_0
                    properties: *ref_1
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        default: null
        '400':
          description: Validation error
          content: *ref_11
        '429':
          description: Rate limit exceeded (default 100/min per client)
          content: &ref_13
            application/json:
              schema:
                allOf: *ref_5
  /api/v1/auth/password/reset/{token}:
    get:
      tags:
        - Auth
      summary: Check password reset token validity (for UI)
      security: []
      operationId: auth.password.reset_token_validity
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token valid (signature, aud, not consumed, not expired)
          content:
            application/json:
              schema:
                allOf: &ref_119
                  - type: object
                    required: *ref_0
                    properties: *ref_1
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - valid
                          - expires_at
                        properties:
                          valid:
                            type: boolean
                          expires_at:
                            type: string
                            format: date-time
        '400':
          description: Validation error
          content: *ref_11
  /api/v1/auth/password/reset:
    post:
      tags:
        - Auth
      summary: Consume reset token and set new password
      security: []
      operationId: auth.password.reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &ref_139
                - token
                - new_password
                - confirm_password
              properties: &ref_140
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
                confirm_password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '200':
          description: Password reset completed; all sessions invalidated.
          content:
            application/json:
              schema:
                allOf: *ref_12
        '400':
          description: Validation error
          content: *ref_11
        '422':
          description: Validation error
          content: *ref_11
        '429':
          description: Rate limit exceeded (default 100/min per client)
          content: *ref_13
  /api/v1/me/avatar:
    post:
      tags:
        - Self-Service
      summary: Upload and attach a new avatar image
      description: Multipart upload for the current user avatar. Returns avatar media with 4 size variants.
      operationId: me.avatar.upload
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: &ref_16
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Avatar image. Max 5 MB. Allowed: image/jpeg, image/png, image/webp, image/gif, image/avif'
                crop:
                  type: string
                  description: Optional JSON crop window (x, y, width, height integers)
      responses:
        '200':
          description: Avatar updated. Returns attached MediaAsset with size_variants populated.
          content:
            application/json:
              schema:
                allOf: &ref_112
                  - type: object
                    required: *ref_0
                    properties: *ref_1
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - avatar
                        properties:
                          avatar:
                            type: object
                            required: *ref_14
                            properties: *ref_15
                          size_variants:
                            type: object
                            required: &ref_95
                              - s64
                              - s128
                              - s256
                              - s512
                            properties: &ref_96
                              s64:
                                type: string
                                format: uri
                              s128:
                                type: string
                                format: uri
                              s256:
                                type: string
                                format: uri
                              s512:
                                type: string
                                format: uri
        '400':
          description: Validation error
          content: *ref_11
        '401':
          description: Authentication required
          content: *ref_6
        '403':
          description: Permission denied
          content: *ref_10
        '413':
          description: Validation error
          content: *ref_11
        '422':
          description: Validation error
          content: *ref_11
    delete:
      tags:
        - Self-Service
      summary: Detach current avatar (requires password reverify or recent 2FA)
      operationId: me.avatar.delete
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *ref_16
        - name: X-Re-Verify-Password
          in: header
          required: false
          schema: &ref_17
            type: string
          description: Current user password proof for high-risk actions (step-up).
        - name: X-2FA-Verified
          in: header
          required: false
          schema: &ref_18
            type: string
          description: |
            Opaque token returned by /api/v1/auth/2fa/challenge within the last 5 minutes, proving step-up for high-risk actions.
      responses:
        '200':
          description: Empty success
          content: &ref_45
            application/json:
              schema:
                allOf: *ref_12
        '401':
          description: Authentication required
          content: *ref_6
        '403':
          description: Permission denied
          content: *ref_10
  /api/v1/me/password:
    put:
      tags:
        - Self-Service
      summary: Update authenticated user password (requires current password proof)
      operationId: me.password.update
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *ref_16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &ref_141
                - current_password
                - new_password
                - confirm_password
              properties: &ref_142
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 256
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
                confirm_password:
                  type: string
                  minLength: 12
                  maxLength: 128
                revoke_all_sessions:
                  type: boolean
                  default: true
                  description: If true, rotate user refresh family and invalidate all existing sessions.
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                allOf: &ref_118
                  - type: object
                    required: *ref_0
                    properties: *ref_1
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - password_changed_at
                          - sessions_invalidated
                        properties:
                          password_changed_at:
                            type: string
                            format: date-time
                          sessions_invalidated:
                            type: boolean
        '400':
          description: Validation error
          content: *ref_11
        '401':
          description: Authentication required
          content: *ref_6
        '403':
          description: Permission denied
          content: *ref_10
        '422':
          description: Validation error
          content: *ref_11
        '429':
          description: Rate limit exceeded (default 100/min per client)
          content: *ref_13
  /api/v1/me/email/request-change:
    post:
      tags:
        - Self-Service
      summary: Request changing current user email address
      operationId: me.email.request_change
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *ref_16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &ref_102
                - new_email
                - password_proof
              properties: &ref_103
                new_email:
                  type: string
                  format: email
                  maxLength: 254
                password_proof:
                  type: string
                  description: Current user password; or X-2FA-Verified header accepted as alternative.
      responses:
        '202':
          description: Email change request accepted; verification sent to new email, warning to old.
          content:
            application/json:
              schema:
                allOf: *ref_12
        '400':
          description: Validation error
          content: *ref_11
        '401':
          description: Authentication required
          content: *ref_6
        '403':
          description: Permission denied
          content: *ref_10
        '409':
          description: Validation error
          content: *ref_11
        '429':
          description: Rate limit exceeded (default 100/min per client)
          content: *ref_13
  /api/v1/me/email/confirm-change:
    post:
      tags:
        - Self-Service
      summary: Confirm pending email change using the signed token from verification email
      operationId: me.email.confirm_change
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *ref_16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email updated; refresh token family invalidated
          content:
            application/json:
              schema:
                allOf: *ref_4
        '400':
          description: Validation error
          content: *ref_11
        '401':
          description: Authentication required
          content: *ref_6
        '403':
          description: Permission denied
          content: *ref_10
  /api/v1/me/privacy:
    get:
      tags:
        - Self-Service
      summary: Read current user privacy settings
      operationId: me.privacy.get
      responses:
        '200':
          description: Privacy settings for the authenticated user
          content:
            application/json:
              schema:
                allOf: &ref_21
                  - type: object
                    required: *ref_0
                    properties: *ref_1
                  - type: object
                    properties:
                      data:
                        type: object
                        required: &ref_19
                          - visibility_profile
                          - visibility_email
                          - visibility_contact_details
                          - visibility_activity_timeline
                          - search_allow_indexing
                          - tracking_personalize_ads
                        properties: &ref_20
                          visibility_profile:
                            type: string
                            enum:
                              - public
                              - unlisted
                              - private
                              - followers_only
                            default: public
                          visibility_email:
                            type: boolean
                            default: false
                            description: Never expose email publicly. Admin and owner still see.
                          visibility_contact_details:
                            type: boolean
                            default: false
                          visibility_activity_timeline:
                            type: boolean
                            default: false
                          search_allow_indexing:
                            type: boolean
                            default: true
                          tracking_personalize_ads:
                            type: boolean
                            default: false
        '401':
          description: Authentication required
          content: *ref_6
    put:
      tags:
        - Self-Service
      summary: Update current user privacy settings (allowlisted flags only)
      operationId: me.privacy.update
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: *ref_16
        - name: X-Re-Verify-Password
          in: header
          required: false
          schema: *ref_17
          description: Current user password proof for high-risk actions (step-up).
        - name: X-2FA-Verified
          in: header
          required: false
          schema: *ref_18
          description: |
            Opaque token returned by /api/v1/auth/2fa/challenge within the last 5 minutes, proving step-up for high-risk actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: &ref_28
                - type: object
                  required: *ref_19
                  properties: *ref_20
              required: &ref_29 []
      responses:
        '200':
          description: Privacy settings updated
          content:
            application/json:
              schema:
                allOf: *ref_21
        '400':
          description: Validation error
          content: *ref_11
        '401':
          description: Authentication required
          content: *ref_6
        '403':
          description: Permission denied
          content: *ref_10
  /api/v1/me/activity:
    get:
      tags:
        - Self-Service
      summary: List current user engagement activity timeline
      operationId: me.activity.list
      parameters:
        - name: page
          in: query
          schema: *ref_22
        - name: per_page
          in: query
          schema: &ref_31
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: category
          in: query
          description: Filter by one or more activity types. Repeat or CSV for multiple.
          schema:
            type: array
            items:
              type: string
              enum: &ref_23
                - login
                - logout
                - profile_edit
                - avatar_update
                - password_change
                - password_reset
                - email_change
                - consent_grant
                - consent_withdraw
                - post_create
                - post_edit
                - post_publish
                - comment_create
                - twofa_enable
                - twofa_disable
                - oauth_link
                - oauth_unlink
                - impersonation_start
                - impersonation_end
                - role_change
                - privacy_change
                - marketing_consent_grant
                - marketing_consent_withdraw
                - export_requested
                - erasure_requested
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
        - name: export
          in: query
          description: Set csv to stream a CSV download of the full result set.
          schema:
            type: string
            enum:
              - csv
      responses:
        '200':
          description: Paginated activity list or CSV stream
          content:
            application/json:
              schema:
                allOf: &ref_32
                  - type: object
                    required: *ref_0
                    properties: *ref_1
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - items
                          - page
                          - per_page
                          - total
                          - total_pages
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              required: &ref_167
                                - id
                                - activity_type
                                - summary
                                - created_at
