Post:
  type: object
  required:
  - id
  - title
  - slug
  - status
  properties:
    id:
      type: string
      format: uuid
    author_id:
      type: string
      format: uuid
    category_id:
      type: string
      format: uuid
      nullable: true
    title:
      type: string
    slug:
      type: string
    excerpt:
      type: string
      nullable: true
    content:
      type: string
    cover_image_media_id:
      type: string
      format: uuid
      nullable: true
    cover:
      nullable: true
      allOf:
      - $ref: Media.yaml#/MediaAsset
    status:
      type: string
      enum:
      - draft
      - review
      - published
      - archived
    published_at:
      type: string
      format: date-time
      nullable: true
    media:
      type: array
      items:
        $ref: posts.yaml#/PostMediaItem
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    tags:
      type: array
      items:
        $ref: Categories.yaml#/Tag
PostMediaItem:
  type: object
  properties:
    media_asset_id:
      type: string
      format: uuid
    kind:
      type: string
      enum:
      - cover
      - inline_image
      - attachment
    sort_order:
      type: integer
    media:
      $ref: Media.yaml#/MediaAsset
EnvelopePostResponse:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        $ref: posts.yaml#/Post
EnvelopePostList:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: posts.yaml#/Post
PostCreateRequest:
  type: object
  required:
  - title
  - content
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
    slug:
      type: string
    category_id:
      type: string
      format: uuid
      nullable: true
    cover_image_media_id:
      type: string
      format: uuid
      nullable: true
    excerpt:
      type: string
    content:
      type: string
    seo:
      $ref: posts.yaml#/PostSEOConfig
    status:
      type: string
      enum:
      - draft
      - review
      - published
      - archived
      default: draft
    tags:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 64
    media:
      type: array
      items:
        type: object
        required:
        - media_asset_id
        - kind
        properties:
          media_asset_id:
            type: string
            format: uuid
          kind:
            type: string
            enum:
            - cover
            - inline_image
            - attachment
          sort_order:
            type: integer
PostUpdateRequest:
  type: object
  minProperties: 1
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
    slug:
      type: string
    excerpt:
      type: string
    content:
      type: string
    category_id:
      type: string
      format: uuid
      nullable: true
    tags:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 64
PostMediaReplaceRequest:
  type: object
  required:
  - items
  properties:
    enforce_cover_consistency:
      type: boolean
      default: true
    items:
      type: array
      maxItems: 500
      items:
        $ref: posts.yaml#/PostMediaItem
EnvelopePostMediaResponse:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - post_id
        - items
        properties:
          post_id:
            type: string
            format: uuid
          items:
            type: array
            items:
              $ref: posts.yaml#/PostMediaItem
Comment:
  type: object
  required:
  - id
  - post_id
  - content
  - status
  properties:
    id:
      type: string
      format: uuid
    post_id:
      type: string
      format: uuid
    parent_id:
      type: string
      format: uuid
      nullable: true
    author_name:
      type: string
      nullable: true
    author_email:
      type: string
      format: email
      nullable: true
    content:
      type: string
    status:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - spam
    created_at:
      type: string
      format: date-time
CommentCreateRequest:
  type: object
  required:
  - content
  properties:
    parent_id:
      type: string
      format: uuid
      nullable: true
    author_name:
      type: string
    author_email:
      type: string
      format: email
    author_website:
      type: string
      format: uri
    content:
      type: string
      minLength: 1
EnvelopeCommentResponse:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        $ref: posts.yaml#/Comment
PostRevision:
  type: object
  required:
  - id
  - post_id
  - revision_number
  - revision_type
  - author_id
  - created_at
  properties:
    id:
      type: string
      format: uuid
    post_id:
      type: string
      format: uuid
    revision_number:
      type: integer
      minimum: 1
    revision_type:
      type: string
      enum:
      - create
      - update
      - restore
      - publish
      - archive
    title:
      type: string
    slug:
      type: string
    excerpt:
      type: string
      nullable: true
    content:
      type: string
    status:
      type: string
      enum:
      - draft
      - review
      - published
      - archived
    author_id:
      type: string
      format: uuid
    category_id_snapshot:
      type: string
      format: uuid
      nullable: true
    cover_image_media_id_snapshot:
      type: string
      format: uuid
      nullable: true
    media_snapshot:
      type: array
      items:
        $ref: posts.yaml#/PostMediaItem
    tags_snapshot:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
          slug:
            type: string
    seo_snapshot:
      $ref: posts.yaml#/PostSEOConfig
    diff:
      type: object
      additionalProperties:
        type: object
        properties:
          old: {}
          new: {}
      nullable: true
    changelog_text:
      type: string
      nullable: true
    editor_note:
      type: string
      nullable: true
    restore_from_revision_id:
      type: string
      format: uuid
      nullable: true
    impersonator_id:
      type: string
      format: uuid
      nullable: true
    impersonation_session_id:
      type: string
      format: uuid
      nullable: true
    request_id:
      type: string
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
EnvelopePostRevisionList:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: posts.yaml#/PostRevision
EnvelopePostRevisionResponse:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        $ref: posts.yaml#/PostRevision
EnvelopePostRevisionRestoreResponse:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - revision
        - post
        properties:
          revision:
            $ref: posts.yaml#/PostRevision
          post:
            $ref: posts.yaml#/Post
PostSEOConfig:
  type: object
  properties:
    seo_title:
      type: string
      maxLength: 200
      nullable: true
    seo_description:
      type: string
      maxLength: 500
      nullable: true
    seo_keywords:
      type: array
      maxItems: 20
      items:
        type: string
        maxLength: 60
    slug:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      maxLength: 200
      minLength: 1
    og_title:
      type: string
      maxLength: 200
      nullable: true
    og_description:
      type: string
      maxLength: 500
      nullable: true
    og_image_id:
      type: string
      format: uuid
      nullable: true
    og_url:
      type: string
      format: uri
      maxLength: 1024
      nullable: true
    twitter_card:
      type: string
      enum:
      - summary
      - summary_large_image
      - app
      - player
      nullable: true
    twitter_title:
      type: string
      maxLength: 200
      nullable: true
    twitter_description:
      type: string
      maxLength: 500
      nullable: true
    twitter_image_id:
      type: string
      format: uuid
      nullable: true
    twitter_creator:
      type: string
      pattern: ^@[A-Za-z0-9_]{1,15}$
      nullable: true
    canonical_url:
      type: string
      format: uri
      maxLength: 1024
      nullable: true
    robots_noindex:
      type: boolean
      default: false
    robots_nofollow:
      type: boolean
      default: false
PostSEOUpdateRequest:
  type: object
  description: Partial update. Only allowlisted fields are accepted; unknown keys rejected.
  allOf:
  - $ref: posts.yaml#/PostSEOConfig
PostSEOPreviewRequest:
  type: object
  properties:
    seo:
      $ref: posts.yaml#/PostSEOConfig
    draft_post:
      type: object
      description: Optional current in-editor draft values (title, excerpt, cover) used for fallback rendering when seo fields are unset.
      properties:
        title:
          type: string
        excerpt:
          type: string
        cover_image_media_id:
          type: string
          format: uuid
          nullable: true
PostSEOPreview:
  type: object
  required:
  - search_preview
  - og_preview
  - twitter_preview
  properties:
    search_preview:
      type: object
      required:
      - title
      - url
      - description
      properties:
        title:
          type: string
        url:
          type: string
        description:
          type: string
    og_preview:
      type: object
      required:
      - title
      - description
      - image_url
      - url
      properties:
        title:
          type: string
        description:
          type: string
        image_url:
          type: string
          nullable: true
        url:
          type: string
    twitter_preview:
      type: object
      required:
      - card
      - title
      - description
      - image_url
      properties:
        card:
          type: string
          enum:
          - summary
          - summary_large_image
          - app
          - player
        title:
          type: string
        description:
          type: string
        image_url:
          type: string
          nullable: true
        creator:
          type: string
          nullable: true
    warnings:
      type: array
      items:
        type: object
        required:
        - field
        - code
        - message
        properties:
          field:
            type: string
          code:
            type: string
          message:
            type: string
PostSEOMetaPublic:
  type: object
  required:
  - title
  properties:
    title:
      type: string
    meta_description:
      type: string
      nullable: true
    meta_keywords:
      type: string
      nullable: true
    canonical:
      type: string
      format: uri
    robots:
      type: string
      nullable: true
      description: e.g. 'noindex,nofollow' or null to default to 'index,follow'
    open_graph:
      type: object
      required:
      - og:type
      - og:title
      - og:description
      - og:url
      properties:
        og:type:
          type: string
          const: article
        og:title:
          type: string
        og:description:
          type: string
        og:image:
          type: string
          nullable: true
        og:url:
          type: string
        article:published_time:
          type: string
          format: date-time
        article:modified_time:
          type: string
          format: date-time
        article:tag:
          type: array
          items:
            type: string
    twitter:
      type: object
      required:
      - twitter:card
      - twitter:title
      - twitter:description
      properties:
        twitter:card:
          type: string
          enum:
          - summary
          - summary_large_image
          - app
          - player
        twitter:title:
          type: string
        twitter:description:
          type: string
        twitter:image:
          type: string
          nullable: true
        twitter:creator:
          type: string
          nullable: true
EnvelopePostSEOResponse:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      meta:
        allOf:
        - $ref: Common.yaml#/Meta
        - type: object
          properties:
            warnings:
              type: array
              items:
                type: object
                required:
                - field
                - code
                - message
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
      data:
        type: object
        required:
        - seo
        properties:
          seo:
            $ref: posts.yaml#/PostSEOConfig
          post_id:
            type: string
            format: uuid
          updated_at:
            type: string
            format: date-time
EnvelopePostSEOPreviewResponse:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        $ref: posts.yaml#/PostSEOPreview
EnvelopePostSEOMetaPublic:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        $ref: posts.yaml#/PostSEOMetaPublic
