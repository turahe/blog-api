Comment:
  type: object
  required:
  - id
  - post_id
  - content
  - status
  - author_id
  - depth
  properties:
    id:
      type: string
      format: uuid
    post_id:
      type: string
      format: uuid
    parent_id:
      type: string
      format: uuid
      nullable: true
    author_id:
      type: string
      format: uuid
      nullable: true
    author:
      nullable: true
      allOf:
      - $ref: './User.yaml#/PublicUserProfile'
    author_display_name:
      type: string
      nullable: true
    author_email:
      type: string
      format: email
      nullable: true
    author_website:
      type: string
      format: uri
      nullable: true
    author_ip_hash:
      type: string
      nullable: true
      description: SHA-256 of client IP for spam/abuse correlation; never exposed to untrusted clients.
    status:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - spam
      - flagged
      - deleted
    moderation:
      nullable: true
      allOf:
      - $ref: '#/CommentModerationSummary'
    spam:
      nullable: true
      allOf:
      - $ref: '#/CommentSpamAssessment'
    content:
      type: string
      minLength: 1
      maxLength: 10000
    content_html:
      type: string
      nullable: true
      description: Rendered safe HTML after markdown processing + XSS sanitization.
    depth:
      type: integer
      minimum: 0
      maximum: 5
    reply_count:
      type: integer
      minimum: 0
      default: 0
    children:
      type: array
      maxItems: 50
      items:
        $ref: '#/Comment'
    upvote_count:
      type: integer
      minimum: 0
      default: 0
    flag_count:
      type: integer
      minimum: 0
      default: 0
    user_has_upvoted:
      type: boolean
      nullable: true
    user_has_flagged:
      type: boolean
      nullable: true
    edited_at:
      type: string
      format: date-time
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

CommentSpamAssessment:
  type: object
  properties:
    score:
      type: number
      format: float
      minimum: 0
      maximum: 1
    verdict:
      type: string
      enum: [ham, unknown, likely_spam, spam]
    engine:
      type: string
      enum: [akismet, mollom, internal_ml, honeypot, rate_limit, admin]
    reason_codes:
      type: array
      items: { type: string }
      maxItems: 50
    details:
      type: object
      nullable: true
      additionalProperties: true
    checked_at:
      type: string
      format: date-time
      nullable: true

CommentModerationSummary:
  type: object
  properties:
    moderated_by_id:
      type: string
      format: uuid
      nullable: true
    moderated_reason:
      type: string
      nullable: true
      maxLength: 500
    moderated_at:
      type: string
      format: date-time
      nullable: true
    flagged_reason_codes:
      type: array
      items:
        type: string
        enum: [spam, abuse, hate, harassment, doxx, self_harm, copyright, impersonation, illegal, other]
      maxItems: 20

CommentCreateRequest:
  type: object
  required:
  - content
  properties:
    parent_id:
      type: string
      format: uuid
      nullable: true
    author_name:
      type: string
      minLength: 1
      maxLength: 80
    author_email:
      type: string
      format: email
      maxLength: 254
    author_website:
      type: string
      format: uri
      maxLength: 500
    content:
      type: string
      minLength: 1
      maxLength: 10000
    subscribe_to_replies:
      type: boolean
      default: false
    honeypot:
      type: string
      maxLength: 200
      description: "Anti-spam honeypot field. Clients MUST leave this empty; anything non-empty marks the submission as spam silently."
    turnstile_response:
      type: string
      maxLength: 4000
      description: "Cloudflare Turnstile / hCaptcha / reCAPTCHA response token, if site-level challenge is configured."

CommentUpdateRequest:
  type: object
  properties:
    content:
      type: string
      minLength: 1
      maxLength: 10000
    edited_reason:
      type: string
      maxLength: 500

CommentListQuery:
  type: object
  properties:
    status:
      type: string
      enum: [pending, approved, rejected, spam, flagged, deleted]
    author_id:
      type: string
      format: uuid
    post_id:
      type: string
      format: uuid
    parent_id:
      type: string
      format: uuid
      nullable: true
    search:
      type: string
      minLength: 1
      maxLength: 200
    after:
      type: string
      format: date-time
    before:
      type: string
      format: date-time

CommentModerateRequest:
  type: object
  required:
  - action
  properties:
    action:
      type: string
      enum: [approve, reject, spam, restore, unspam]
    reason:
      type: string
      maxLength: 500
    notify_author:
      type: boolean
      default: false

EnvelopeCommentResponse:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        $ref: '#/Comment'

EnvelopeCommentList:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - items
        - total
        - page
        - per_page
        properties:
          items:
            type: array
            items:
              $ref: '#/Comment'
          total:
            type: integer
            minimum: 0
          page:
            type: integer
            minimum: 1
          per_page:
            type: integer
            minimum: 1
            maximum: 200

EnvelopeCommentThread:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - root
        - descendants
        properties:
          root:
            $ref: '#/Comment'
          descendants:
            type: array
            items:
              $ref: '#/Comment'

EnvelopeCommentStats:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - totals
        properties:
          totals:
            type: object
            required:
            - pending
            - approved
            - rejected
            - spam
            - flagged
            properties:
              pending: { type: integer, minimum: 0 }
              approved: { type: integer, minimum: 0 }
              rejected: { type: integer, minimum: 0 }
              spam: { type: integer, minimum: 0 }
              flagged: { type: integer, minimum: 0 }
          by_post:
            type: array
            items:
              type: object
              required:
              - post_id
              - comment_count
              properties:
                post_id: { type: string, format: uuid }
                comment_count: { type: integer, minimum: 0 }
