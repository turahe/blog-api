Category:
  type: object
  required:
  - id
  - name
  - slug
  properties:
    id:
      type: string
      format: uuid
    parent_id:
      type: string
      format: uuid
      nullable: true
    name:
      type: string
    slug:
      type: string
    description:
      type: string
      nullable: true
    image_id:
      type: string
      format: uuid
      nullable: true
    image:
      nullable: true
      allOf:
      - $ref: Media.yaml#/MediaAsset
    lft:
      type: integer
    rgt:
      type: integer
    depth:
      type: integer
    sort_order:
      type: integer
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
EnvelopeCategoryList:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: Categories.yaml#/Category
EnvelopeCategoryResponse:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        $ref: Categories.yaml#/Category
CategoryCreateRequest:
  type: object
  required:
  - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
    slug:
      type: string
    description:
      type: string
      maxLength: 2000
    parent_id:
      type: string
      format: uuid
      nullable: true
    image_id:
      type: string
      format: uuid
      nullable: true
CategoryUpdateRequest:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
    slug:
      type: string
    description:
      type: string
      maxLength: 2000
      nullable: true
    parent_id:
      type: string
      format: uuid
      nullable: true
    image_id:
      type: string
      format: uuid
      nullable: true
CategoryReorderRequest:
  type: object
  required:
  - ordered_ids
  properties:
    parent_id:
      type: string
      format: uuid
      nullable: true
    ordered_ids:
      type: array
      minItems: 1
      items:
        type: string
        format: uuid
Tag:
  type: object
  required:
  - id
  - name
  - slug
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    slug:
      type: string
    created_at:
      type: string
      format: date-time
EnvelopeTagList:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: Categories.yaml#/Tag
TagCreateRequest:
  type: object
  required:
  - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
    slug:
      type: string
TagUpdateRequest:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 64
    slug:
      type: string
TagMergeRequest:
  type: object
  required:
  - into_id
  properties:
    into_id:
      type: string
      format: uuid
EnvelopeTagResponse:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        $ref: Categories.yaml#/Tag
