EnvelopeEmpty:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        nullable: true
        default: null
EnvelopeError:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    required:
    - error
    properties:
      data:
        nullable: true
      error:
        $ref: Common.yaml#/Error
Envelope:
  type: object
  required:
  - ok
  - code
  - meta
  properties:
    ok:
      type: boolean
    code:
      type: integer
      description: >
        Packed response code = HTTP (3 digits) + service (2 digits) + case (2 digits).
        Example 2010301 = HTTP 201 + Comments (03) + Success (01).
        See docs/backend/response-codes.md.
      example: 2000001
    data: {}
    links:
      nullable: true
      allOf:
      - $ref: Common.yaml#/PaginationLinks
    meta:
      oneOf:
      - $ref: Common.yaml#/Meta
      - $ref: Common.yaml#/PaginationMeta
    error:
      nullable: true
      allOf:
      - $ref: Common.yaml#/Error
# Meta is request correlation for non-list responses.
Meta:
  type: object
  properties:
    request_id:
      type: string
    window:
      type: string
# PaginationLinks mirrors Laravel length-aware paginator links.
PaginationLinks:
  type: object
  required:
  - first
  - last
  - prev
  - next
  properties:
    first:
      type: string
      format: uri
      nullable: true
    last:
      type: string
      format: uri
      nullable: true
    prev:
      type: string
      format: uri
      nullable: true
    next:
      type: string
      format: uri
      nullable: true
# PaginationMeta mirrors Laravel length-aware paginator meta.
PaginationMeta:
  type: object
  required:
  - current_page
  - last_page
  - path
  - per_page
  - total
  properties:
    request_id:
      type: string
    current_page:
      type: integer
      minimum: 1
    from:
      type: integer
      nullable: true
    last_page:
      type: integer
      minimum: 1
    path:
      type: string
      format: uri
    per_page:
      type: integer
      minimum: 1
    to:
      type: integer
      nullable: true
    total:
      type: integer
      minimum: 0
# PaginatedEnvelope is the shared shape for list endpoints:
# { ok, data: [...], links, meta: PaginationMeta }.
PaginatedEnvelope:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    required:
    - data
    - links
    - meta
    properties:
      data:
        type: array
      links:
        $ref: Common.yaml#/PaginationLinks
      meta:
        $ref: Common.yaml#/PaginationMeta
Error:
  type: object
  required:
  - code
  - message
  properties:
    code:
      type: string
      examples:
      - validation_error
      - unauthorized
      - forbidden
      - not_found
      - too_many_requests
      - conflict
    message:
      type: string
    details:
      type: object
      additionalProperties: true
EnvelopeHealth:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - ok
            - degraded
            - down
          checks:
            type: object
            additionalProperties:
              type: string
              enum:
              - ok
              - down
EnvelopeVersion:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - version
        - commit
        - build_time
        - go_version
        properties:
          version:
            type: string
          commit:
            type: string
          build_time:
            type: string
          go_version:
            type: string
EnvelopeUserActivityList:
  allOf:
  - $ref: Common.yaml#/PaginatedEnvelope
  - type: object
    properties:
      data:
        type: array
        items:
          $ref: User.yaml#/UserActivityItem
EnvelopeActivityExportAccepted:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - job_id
        - status
        properties:
          job_id:
            type: string
            format: uuid
          status:
            type: string
            enum:
            - queued
          estimated_ready_at:
            type: string
            format: date-time
            nullable: true
