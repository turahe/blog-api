Notification:
  type: object
  required:
  - id
  - type
  - title
  properties:
    id:
      type: string
      format: uuid
    type:
      type: string
    title:
      type: string
    preview:
      type: string
      nullable: true
    read:
      type: boolean
    created_at:
      type: string
      format: date-time
EnvelopeNotificationList:
  allOf:
  - $ref: Common.yaml#/Envelope
  - type: object
    properties:
      data:
        type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: Notifications.yaml#/Notification
